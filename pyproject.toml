[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "skills-tree"
version         = "1.0.0"
description     = "Architect — taxonomy-driven skill recommendation engine for AI agent builders"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.11"
keywords        = ["ai", "agents", "skills", "recommendation", "llm", "taxonomy"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "networkx>=3.0",
    "markdown>=3.5",
    "requests>=2.31",
]

[project.optional-dependencies]
dev  = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27.0"]
server = ["uvicorn[standard]>=0.29.0"]

[project.urls]
Homepage       = "https://github.com/SamoTech/skills-tree"
Documentation  = "https://github.com/SamoTech/skills-tree#readme"
Repository     = "https://github.com/SamoTech/skills-tree"
"Bug Tracker"  = "https://github.com/SamoTech/skills-tree/issues"

[project.scripts]
skills-tree = "cli.main:app"

[tool.setuptools]
packages = [
    "api",
    "api.routes",
    "cli",
    "mcp",
    "tools",
]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
