[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "skills-tree"
version         = "1.0.0"
description     = "Architect — taxonomy-driven skill recommendation engine for AI agent builders"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.11"
keywords        = ["ai", "agents", "skills", "recommendation", "llm", "taxonomy"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "networkx>=3.0",
    "markdown>=3.5",
    "requests>=2.31",
]

[project.optional-dependencies]
dev    = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27.0"]
server = ["uvicorn[standard]>=0.29.0"]

[project.urls]
Homepage      = "https://github.com/SamoTech/skills-tree"
Documentation = "https://github.com/SamoTech/skills-tree#readme"
Repository    = "https://github.com/SamoTech/skills-tree"
"Bug Tracker" = "https://github.com/SamoTech/skills-tree/issues"

[project.scripts]
skills-tree = "cli.main:app"

# ---------------------------------------------------------------------------
# Package discovery
# ---------------------------------------------------------------------------
[tool.setuptools]
# include_package_data=true tells setuptools to honour MANIFEST.in and
# package-data globs for every discovered package.
include-package-data = true

[tool.setuptools.packages.find]
# Auto-discover all Python packages (directories with __init__.py).
# This replaces the hand-maintained package list and catches new sub-packages.
where   = ["."]          # root of the repo
exclude = ["tests*", "evaluation*", "docs*", "meta*", "benchmarks*", "assets*", "badges*"]

# ---------------------------------------------------------------------------
# Package data — files shipped INSIDE Python packages (importlib-accessible)
# ---------------------------------------------------------------------------
[tool.setuptools.package-data]
# Include data files that live inside each Python package directory.
# Pattern applied to every package unless overridden below.
"*"          = ["*.md", "*.json", "*.toml", "*.yml", "*.yaml"]
"tools"      = ["*.py"]     # all tool scripts (already Python, explicit for clarity)

# ---------------------------------------------------------------------------
# Data files — top-level non-package directories copied into the wheel/sdist
# These are the runtime files the engine reads at startup.
# dest="" means they land at the root of the installed package tree,
# which for an editable install is the repo root — exactly where the
# engine already expects them via relative paths.
# ---------------------------------------------------------------------------
[tool.setuptools.data-files]
"data"            = ["data/SKILLS_GRAPH.json"]
"meta"            = [
    "meta/GOAL_TAXONOMY.md",
    "meta/GOAL_TAXONOMY.json",
]
"benchmarks"      = ["benchmarks/INDEX.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length    = 100
target-version = "py311"
