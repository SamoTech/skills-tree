[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "skills-tree"
version         = "1.13.0"
description     = "Architect — taxonomy-driven skill recommendation engine for AI agent builders"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.11"
keywords        = ["ai", "agents", "skills", "recommendation", "llm", "taxonomy"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "networkx>=3.0",
    "markdown>=3.5",
    "requests>=2.31",
]

[project.optional-dependencies]
dev    = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27.0", "python-semantic-release>=9.8"]
server = ["uvicorn[standard]>=0.29.0"]

[project.urls]
Homepage      = "https://github.com/SamoTech/skills-tree"
Documentation = "https://github.com/SamoTech/skills-tree#readme"
Repository    = "https://github.com/SamoTech/skills-tree"
"Bug Tracker" = "https://github.com/SamoTech/skills-tree/issues"

[project.scripts]
skills-tree = "cli.main:app"

# ---------------------------------------------------------------------------
# Package discovery
# ---------------------------------------------------------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where   = ["."]
exclude = ["tests*", "evaluation*", "docs*", "meta*", "benchmarks*", "assets*", "badges*"]

# ---------------------------------------------------------------------------
# Package data — files inside Python packages (importlib-accessible)
# ---------------------------------------------------------------------------
[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.toml", "*.yml", "*.yaml"]

# ---------------------------------------------------------------------------
# Data files — top-level non-package runtime assets.
# Rule: only list files that EXIST in the repository.
# meta/GOAL_TAXONOMY.json intentionally absent — file does not exist.
# ---------------------------------------------------------------------------
[tool.setuptools.data-files]
"data"       = ["data/SKILLS_GRAPH.json"]
"meta"       = ["meta/GOAL_TAXONOMY.md"]
"benchmarks" = ["benchmarks/INDEX.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length    = 100
target-version = "py311"

# ---------------------------------------------------------------------------
# python-semantic-release configuration
# Docs: https://python-semantic-release.readthedocs.io/en/latest/
# ---------------------------------------------------------------------------
[tool.semantic_release]
# The single source of truth for the version number.
version_toml               = ["pyproject.toml:project.version"]
branch                     = "main"
build_command              = "pip install build && python -m build"
dist_path                  = "dist/"
upload_to_pypi             = false    # PyPI publish is handled by release.yml (OIDC)
upload_to_release          = true     # attach dist/ artifacts to GitHub Release
changelog_file             = "CHANGELOG.md"
commit_message             = "chore(release): v{version} [skip ci]"
tag_format                 = "v{version}"

[tool.semantic_release.commit_parser_options]
# Bump rules (Conventional Commits):
#   feat:           minor bump
#   fix/perf/refactor: patch bump
#   BREAKING CHANGE or feat!: major bump
# All other types (docs, chore, ci, test, style) cause NO release.
allowed_tags   = ["feat", "fix", "perf", "refactor", "docs", "chore", "ci", "test", "style", "build", "revert"]
minor_tags     = ["feat"]
patch_tags     = ["fix", "perf", "refactor"]

[tool.semantic_release.changelog]
# Auto-generate changelog sections from commit types.
exclude_commit_patterns = [
    "^chore\\(release\\):",     # skip the version-bump commit itself
    "^Merge ",
    "^Initial commit",
]

[tool.semantic_release.remote]
name  = "origin"
type  = "github"
token = { env = "GH_TOKEN" }
