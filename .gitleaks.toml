[allowlist]
  description = "Allowlist for pinned GitHub Action commit SHAs and other known-safe patterns."

  # Pinned third-party action SHAs used for supply-chain security, not secrets.
  # These are immutable git commit SHAs — gitleaks high-entropy rules false-positive on them.
  regexes = [
    # gitleaks/gitleaks-action v2.3.9 SHA pin in build-graph.yml
    "ff98106e4c7b2bc287b24eaf42907196329070c7",
    # Previous incorrect SHA (one hex digit off) — kept to avoid history re-triggers
    "b6c5bf31b84b54c65d9cb4f4c46b4d9765c10a4f",
    # Another incorrect candidate SHA tested during fix
    "ff98106e4c7b2bc287b24eaf42907196329070c4",
    # stefanzweifel/git-auto-commit-action SHA pin
    "3f65f6fb5f2acb7d13f4f495facac4ac7b1f3b65",
  ]

  # Paths that are documentation-only and may contain illustrative tokens/keys.
  # Skills Markdown files are example code, not live credentials.
  paths = [
    "skills",
    "benchmarks",
    "labs",
    "blueprints",
    "docs",
  ]
