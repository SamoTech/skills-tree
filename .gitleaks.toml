[allowlist]
  description = "Allowlist for pinned GitHub Action commit SHAs and other known-safe patterns."

  # Pinned third-party action SHAs used for supply-chain security, not secrets.
  # These are immutable git commit SHAs — gitleaks high-entropy rules false-positive on them.
  regexes = [
    # gitleaks/gitleaks-action v2.3.9 SHA pin in build-graph.yml
    "ff98106e4c7b2bc287b24eaf42907196329070c7",
    # Previous incorrect SHA (one hex digit off) — kept to avoid history re-triggers
    "b6c5bf31b84b54c65d9cb4f4c46b4d9765c10a4f",
    # Another incorrect candidate SHA tested during fix
    "ff98106e4c7b2bc287b24eaf42907196329070c4",
    # stefanzweifel/git-auto-commit-action SHA pin
    "3f65f6fb5f2acb7d13f4f495facac4ac7b1f3b65",
    # GitHub token regex patterns used as grep/scan examples in workflow files.
    # These are detection patterns, not live credentials.
    "ghp_[A-Za-z0-9]{36}",
    "ghs_[A-Za-z0-9]{36}",
    "sk-[A-Za-z0-9]{48}",
    "AIza[0-9A-Za-z\\-_]{35}",
    "AKIA[0-9A-Z]{16}",
  ]

  # Paths that are documentation-only or tooling and may contain illustrative
  # tokens/keys or regex patterns that match secret shapes.
  # Note: `paths` only applies to `detect` (full-repo) mode, not `protect`
  # (diff) mode used by the gitleaks Action on PRs. Rule-level allowlists
  # (see [[rules]] below) are required to suppress false positives in diff mode.
  paths = [
    "skills",
    "benchmarks",
    "labs",
    "blueprints",
    "docs",
    ".github/workflows",
    "tools",
  ]

# ---------------------------------------------------------------------------
# Rule-level allowlists
# These fire in BOTH detect and protect (diff) modes, making them the correct
# mechanism for suppressing PR-scan false positives.
# ---------------------------------------------------------------------------

[[rules]]
  # Extend the built-in generic-api-key rule to allowlist the shields.io
  # endpoint URL in tools/inject_badge_links.py. The high-entropy query
  # parameter `?url=https://samotech.github.io/...` trips the rule even
  # though this is a hardcoded public URL, not a credential.
  id = "generic-api-key"
  [rules.allowlist]
    regexes = [
      # shields.io endpoint base URL constant — public URL, not a secret.
      "img\\.shields\\.io/endpoint\\?url=https://samotech\\.github\\.io/skills-tree/badges/",
    ]
