<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Engineering Skill Explorer — skills-tree</title>
<meta name="description" content="Explore 368 AI agent skills, their dependencies, and learning paths. The open knowledge graph for AI Engineering.">
<meta property="og:title" content="AI Engineering Skill Explorer">
<meta property="og:description" content="Explore 368 AI agent skills across 14 categories. Built on skills-tree — the open AI Engineering OS.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<header class="topnav" role="banner">
  <div class="topnav-inner">
    <a href="#" class="brand" aria-label="skills-tree home">
      <svg class="brand-logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="16" cy="8" r="3" fill="currentColor"/>
        <circle cx="8" cy="22" r="3" fill="currentColor"/>
        <circle cx="24" cy="22" r="3" fill="currentColor"/>
        <line x1="16" y1="11" x2="8" y2="19" stroke="currentColor" stroke-width="1.5"/>
        <line x1="16" y1="11" x2="24" y2="19" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span class="brand-name">skills-tree</span>
      <span class="brand-tag">Explorer</span>
    </a>
    <nav class="topnav-links" aria-label="Primary navigation">
      <a href="https://github.com/SamoTech/skills-tree" target="_blank" rel="noopener noreferrer" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
        GitHub
      </a>
      <button class="theme-toggle nav-link" data-theme-toggle aria-label="Switch to light mode" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </nav>
  </div>
</header>
<section class="metrics-bar" aria-label="Repository statistics" id="main-content">
  <div class="metrics-inner">
    <div class="metric-card"><span class="metric-value" id="metric-nodes">—</span><span class="metric-label">Skills</span></div>
    <div class="metric-divider" aria-hidden="true"></div>
    <div class="metric-card"><span class="metric-value" id="metric-edges">—</span><span class="metric-label">Connections</span></div>
    <div class="metric-divider" aria-hidden="true"></div>
    <div class="metric-card"><span class="metric-value" id="metric-cats">—</span><span class="metric-label">Categories</span></div>
    <div class="metric-divider" aria-hidden="true"></div>
    <div class="metric-card"><span class="metric-value" id="metric-requires">—</span><span class="metric-label">REQUIRES edges</span></div>
    <div class="metric-divider" aria-hidden="true"></div>
    <div class="metric-card"><span class="metric-value" id="metric-schema">—</span><span class="metric-label">Schema</span></div>
  </div>
</section>
<div class="explorer-layout">
  <aside class="sidebar" role="complementary" aria-label="Search and filters">
    <div class="search-box-wrap">
      <label for="skill-search" class="sr-only">Search skills</label>
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="skill-search" type="search" class="search-input" placeholder="Search 368 skills…" autocomplete="off" spellcheck="false" aria-label="Search skills by name or ID">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <div class="filter-group" role="group" aria-labelledby="filter-level-label">
      <span class="filter-label" id="filter-level-label">Level</span>
      <div class="filter-chips" id="filter-level">
        <button class="chip chip-active" data-filter="level" data-value="all" aria-pressed="true">All</button>
        <button class="chip" data-filter="level" data-value="basic" aria-pressed="false">Basic</button>
        <button class="chip" data-filter="level" data-value="intermediate" aria-pressed="false">Intermediate</button>
        <button class="chip" data-filter="level" data-value="advanced" aria-pressed="false">Advanced</button>
      </div>
    </div>
    <div class="filter-group" role="group" aria-labelledby="filter-stab-label">
      <span class="filter-label" id="filter-stab-label">Stability</span>
      <div class="filter-chips" id="filter-stability">
        <button class="chip chip-active" data-filter="stability" data-value="all" aria-pressed="true">All</button>
        <button class="chip" data-filter="stability" data-value="stable" aria-pressed="false">Stable</button>
        <button class="chip" data-filter="stability" data-value="evolving" aria-pressed="false">Evolving</button>
        <button class="chip" data-filter="stability" data-value="experimental" aria-pressed="false">Experimental</button>
      </div>
    </div>
    <div class="filter-group" role="group" aria-labelledby="filter-cat-label">
      <span class="filter-label" id="filter-cat-label">Category</span>
      <div class="filter-chips filter-chips-cats" id="filter-category" role="list"></div>
    </div>
    <div class="results-meta" aria-live="polite" aria-atomic="true"><span id="results-count">Loading…</span></div>
  </aside>
  <main class="skill-list-panel" aria-label="Skill results">
    <div class="skill-grid" id="skill-grid" role="list">
      <div class="skill-card skeleton" aria-hidden="true"><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:40%"></div></div>
      <div class="skill-card skeleton" aria-hidden="true"><div class="skeleton-line" style="width:75%"></div><div class="skeleton-line" style="width:35%"></div></div>
      <div class="skill-card skeleton" aria-hidden="true"><div class="skeleton-line" style="width:50%"></div><div class="skeleton-line" style="width:45%"></div></div>
    </div>
  </main>
  <aside class="detail-panel" id="detail-panel" aria-label="Skill details" aria-live="polite">
    <div class="detail-empty" id="detail-empty">
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.5" opacity="0.3"/><circle cx="16" cy="8" r="3" fill="currentColor" opacity="0.3"/><circle cx="8" cy="22" r="3" fill="currentColor" opacity="0.3"/><circle cx="24" cy="22" r="3" fill="currentColor" opacity="0.3"/><line x1="16" y1="11" x2="8" y2="19" stroke="currentColor" stroke-width="1.5" opacity="0.3"/><line x1="16" y1="11" x2="24" y2="19" stroke="currentColor" stroke-width="1.5" opacity="0.3"/></svg>
      <p>Select a skill to explore<br>its details and dependencies</p>
    </div>
    <div class="detail-content" id="detail-content" hidden>
      <div class="detail-header">
        <div class="detail-header-top">
          <span class="detail-cat-badge" id="d-cat"></span>
          <div class="detail-actions">
            <button class="icon-btn" id="btn-share" aria-label="Copy share URL" title="Copy share URL"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg></button>
            <button class="icon-btn" id="btn-github" aria-label="View source on GitHub" title="View on GitHub"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg></button>
          </div>
        </div>
        <h2 class="detail-title" id="d-title"></h2>
        <code class="detail-id" id="d-id"></code>
      </div>
      <div class="detail-tags-row">
        <span class="tag tag-level" id="d-level"></span>
        <span class="tag tag-stability" id="d-stability"></span>
        <span class="tag tag-version" id="d-version"></span>
        <span class="tag tag-layer" id="d-layer"></span>
      </div>
      <dl class="detail-meta">
        <div class="meta-row"><dt>Added</dt><dd id="d-added">—</dd></div>
        <div class="meta-row"><dt>Source</dt><dd><code id="d-source" class="mono-small">—</code></dd></div>
      </dl>
      <div class="detail-section" id="section-prereqs"><h3 class="detail-section-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Prerequisites</h3><div class="dep-list" id="d-prereqs"></div></div>
      <div class="detail-section" id="section-requires-in"><h3 class="detail-section-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Required by</h3><div class="dep-list" id="d-requires-in"></div></div>
      <div class="detail-section" id="section-requires-out"><h3 class="detail-section-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 5v2M12 17v2M5 12H3M21 12h-2M7.05 7.05L5.64 5.64M18.36 18.36l-1.41-1.41M7.05 16.95l-1.41 1.41M18.36 5.64l-1.41 1.41"/></svg>Requires</h3><div class="dep-list" id="d-requires-out"></div></div>
      <div class="detail-section" id="section-related"><h3 class="detail-section-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>Related Skills</h3><div class="dep-list" id="d-related"></div></div>
    </div>
  </aside>
</div>
<div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>
<div class="mobile-overlay" id="mobile-overlay" hidden aria-modal="true" role="dialog" aria-label="Skill details">
  <div class="mobile-overlay-header">
    <h2 class="mobile-overlay-title">Skill Details</h2>
    <button class="icon-btn" id="close-overlay" aria-label="Close skill details"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div id="mobile-overlay-body"></div>
</div>
<script src="app.js"></script>
</body>
</html>
