name: Weekly Highlights

on:
  schedule:
    - cron: '0 5 * * 1'  # Monday 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print output, do not commit)'
        type: boolean
        default: false

permissions:
  contents: write

# Serialize runs of THIS workflow on the same ref so concurrent
# scheduled triggers do not race when pushing back to main.
concurrency:
  group: weekly-highlights-${{ github.ref }}
  cancel-in-progress: false

jobs:
  weekly-highlights:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Weekly Highlights
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python3 tools/weekly_highlights.py

      - name: Commit updated README
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "chore(highlights): weekly README highlights update [skip ci]"
          for attempt in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "ERROR: Push failed after 3 attempts."
          exit 1
