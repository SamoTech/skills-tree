name: Regen search index (branch audit)

# Temporary one-shot: rebuild the Lunr.js search index on the audit branch
# so the PR ships an index matching the edited skill files.

on:
  push:
    branches: [counsel/audit-fixes-2026-10-16]
    paths:
      - '.github/workflows/regen-search-index-branch.yml'

permissions: {}

concurrency:
  group: regen-index-branch
  cancel-in-progress: true

jobs:
  regen:
    name: Rebuild index on branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: counsel/audit-fixes-2026-10-16
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install indexer dependencies
        run: pip install --quiet PyYAML==6.0.3

      - name: Build search index
        run: |
          python tools/build_search_index.py \
            --skills-root skills/ \
            --output docs/search-index.json \
            --package-output data/search-index.json

      - name: Commit regenerated index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/search-index.json data/search-index.json
          git diff --staged --quiet && echo "No changes." && exit 0
          git commit -m "chore(search): regenerate search index for edited skill files"
          git push origin HEAD:counsel/audit-fixes-2026-10-16
