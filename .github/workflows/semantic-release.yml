name: Semantic Release (superseded — disabled)

# THIS WORKFLOW IS DISABLED.
# It has been superseded by zero-touch-release.yml which runs
# semantic-release as its first step in a single consolidated pipeline.
# Kept here as a reference; only runs on manual dispatch.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: "Manual semantic-release (debug only)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'python-semantic-release>=9.8' --quiet
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version
