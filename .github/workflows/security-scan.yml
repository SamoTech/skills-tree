name: Security Scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        # Pinned to immutable SHA (v2.3.9) — do not change to a floating tag.
        # To update: https://api.github.com/repos/gitleaks/gitleaks-action/tags
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" bandit pip-audit

      - name: Generate Bandit SAST report
        run: |
          bandit -r api cli mcp registry tools -f json -o bandit-report.json --exit-zero

      - name: Enforce Bandit high-severity gate
        run: |
          bandit -r api cli mcp registry tools -lll -iii

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

      - name: Run pip-audit
        run: pip-audit --strict --skip-editable

      - name: Verify docs secret scan scope
        run: |
          echo "Gitleaks scans the full repository history. Python SAST covers api/, cli/, mcp/, registry/, and tools/. Dependency audit excludes the local editable project package and audits its installed third-party dependency set."
