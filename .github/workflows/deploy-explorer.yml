name: Deploy Explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/explorer/**'
      - 'data/SKILLS_GRAPH.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # INITIATIVE-012B2: Stage docs/ + data/ together so that
      # /skills-tree/data/SKILLS_GRAPH.json resolves on GitHub Pages.
      - name: Stage artifact (docs + data)
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          mkdir -p _site/data
          cp data/SKILLS_GRAPH.json _site/data/SKILLS_GRAPH.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
