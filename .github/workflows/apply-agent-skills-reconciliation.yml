name: Apply Agent Skills Reconciliation

# Dedicated deterministic corpus generation trigger.

on:
  push:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  reconcile-and-generate:
    if: "(github.ref == 'refs/heads/feat/agent-skills-deterministic-generation' || github.head_ref == 'feat/agent-skills-deterministic-generation') && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && !contains(github.event.head_commit.message || '', '[agent-skills-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply verified reconciliation
        run: python tools/apply_agent_skills_reconciliation.py
      - name: Validate generated Agent Skills
        run: python tools/validate_agent_skills.py
      - name: Verify repository state
        run: |
          python tools/reconcile_agent_skills.py
          git diff --check
      - name: Commit generated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-skills tools
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: reconcile and generate eligible Agent Skills [agent-skills-generated]"
          git push
