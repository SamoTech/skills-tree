name: Validate Skills Graph

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'schema/**'
      - 'tools/**'
      - 'data/**'
      - '.github/workflows/validate-graph.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'schema/**'
      - 'tools/**'
      - 'data/**'
      - '.github/workflows/validate-graph.yml'

# Serialize generated-main writers with the repository-wide main writer group.
concurrency:
  group: auto-commit-main
  cancel-in-progress: false

# Default: restrict all permissions to read-only.
# Individual jobs that need write access declare it explicitly.
permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build Graph & Validate
    runs-on: ubuntu-latest
    # PR validation is read-only; trusted-main generation is isolated below.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build graph (dry-run validation)
        id: build
        run: |
          python tools/build_graph.py --dry-run
          echo "build_status=$?" >> $GITHUB_OUTPUT

      # Validate the graph generated from the current source. On PRs this
      # materializes the graph into the workspace; on main pushes the same
      # generation is validated before a separate least-privileged writer job
      # commits the generated projection.
      - name: Materialize graph for validation
        run: |
          python tools/build_graph.py --output data/SKILLS_GRAPH.json
          echo "Graph generated successfully."

      - name: Validate graph schema
        run: |
          pip install jsonschema --quiet
          python - <<'EOF'
          import json
          from pathlib import Path
          from jsonschema import Draft7Validator, RefResolver

          root = Path(".").resolve()
          graph_path = root / "data/SKILLS_GRAPH.json"
          if not graph_path.exists():
              raise SystemExit("SKILLS_GRAPH.json was not generated.")

          graph = json.loads(graph_path.read_text(encoding="utf-8"))
          if not isinstance(graph, dict):
              raise SystemExit("SKILLS_GRAPH.json is not a JSON object.")

          schema = json.loads((root / "schema/graph.schema.json").read_text(encoding="utf-8"))
          skill_schema = json.loads((root / "schema/skill.schema.json").read_text(encoding="utf-8"))
          edge_schema = json.loads((root / "schema/edge.schema.json").read_text(encoding="utf-8"))
          store = {
              schema["$id"]: schema,
              skill_schema["$id"]: skill_schema,
              edge_schema["$id"]: edge_schema,
          }
          resolver = RefResolver(schema["$id"], schema, store=store)
          errors = sorted(Draft7Validator(schema, resolver=resolver).iter_errors(graph), key=lambda e: list(e.path))
          if errors:
              for error in errors[:20]:
                  location = ".".join(str(part) for part in error.path) or "<root>"
                  print(f"FAIL: {location}: {error.message}")
              raise SystemExit(f"Graph schema validation failed with {len(errors)} error(s).")

          node_count = graph["meta"]["node_count"]
          edge_count = graph["meta"]["edge_count"]
          if node_count != len(graph["nodes"]) or edge_count != len(graph["edges"]):
              raise SystemExit("Graph metadata counts do not match generated arrays.")
          print(f"PASS: graph schema and counts valid ({node_count} nodes, {edge_count} edges).")
          EOF

      - name: Duplicate node ID check
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path

          graph_path = Path("data/SKILLS_GRAPH.json")
          if not graph_path.exists():
              print("SKIP")
              sys.exit(0)

          data = json.loads(graph_path.read_text())
          if isinstance(data, str):
              sys.exit(0)

          ids = [n["id"] for n in data.get("nodes", [])]
          dupes = [i for i in ids if ids.count(i) > 1]
          if dupes:
              print(f"FAIL: Duplicate node IDs: {list(set(dupes))}")
              sys.exit(1)
          print(f"PASS: {len(ids)} unique node IDs.")
          EOF

      - name: Self-loop edge check
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path

          graph_path = Path("data/SKILLS_GRAPH.json")
          if not graph_path.exists():
              print("SKIP")
              sys.exit(0)

          data = json.loads(graph_path.read_text())
          if isinstance(data, str):
              sys.exit(0)

          loops = [e for e in data.get("edges", []) if e["source"] == e["target"]]
          if loops:
              print(f"FAIL: Self-loop edges: {loops}")
              sys.exit(1)
          print(f"PASS: No self-loops in {len(data.get('edges', []))} edges.")
          EOF

      - name: Invalid source edge check
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path

          graph_path = Path("data/SKILLS_GRAPH.json")
          if not graph_path.exists():
              print("SKIP")
              sys.exit(0)

          data = json.loads(graph_path.read_text())
          if isinstance(data, str):
              sys.exit(0)

          node_ids = {n["id"] for n in data.get("nodes", [])}
          invalid = [e for e in data.get("edges", []) if e["source"] not in node_ids]
          if invalid:
              print(f"FAIL: {len(invalid)} edges with invalid source IDs.")
              for e in invalid[:10]:
                  print(f"  {e['source']} -> {e['target']}")
              sys.exit(1)
          print(f"PASS: All edge sources are valid node IDs.")
          EOF

      # -----------------------------------------------------------------------
      # INITIATIVE-008R Phase 1: Dangling target detection
      # Validates that every edge.target exists in the node registry.
      # Added: 2026-06-23 | Decision: D-INIT-008R-001
      # -----------------------------------------------------------------------
      - name: Dangling target edge check
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path

          graph_path = Path("data/SKILLS_GRAPH.json")
          if not graph_path.exists():
              print("SKIP")
              sys.exit(0)

          data = json.loads(graph_path.read_text())
          if isinstance(data, str):
              sys.exit(0)

          node_ids = {n["id"] for n in data.get("nodes", [])}
          dangling = [e for e in data.get("edges", []) if e["target"] not in node_ids]
          if dangling:
              print(f"FAIL: {len(dangling)} edges with dangling (missing) target node IDs.")
              for e in dangling[:10]:
                  print(f"  {e['source']} -> {e['target']} [{e.get('type', '?')}]")
              sys.exit(1)
          print(f"PASS: All {len(data.get('edges', []))} edge targets are valid node IDs.")
          EOF

      # -----------------------------------------------------------------------
      # INITIATIVE-008R Phase 2: Duplicate edge detection
      # Canonical key: (source, target, type). Duplicate = identical triple.
      # Added: 2026-06-23 | Decision: D-INIT-008R-001
      # -----------------------------------------------------------------------
      - name: Duplicate edge check
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path

          graph_path = Path("data/SKILLS_GRAPH.json")
          if not graph_path.exists():
              print("SKIP")
              sys.exit(0)

          data = json.loads(graph_path.read_text())
          if isinstance(data, str):
              sys.exit(0)

          edges = data.get("edges", [])
          seen = {}
          dupes = []
          for e in edges:
              key = (e["source"], e["target"], e.get("type", ""))
              if key in seen:
                  dupes.append(e)
              else:
                  seen[key] = True
          if dupes:
              print(f"FAIL: {len(dupes)} duplicate edges (same source, target, type).")
              for e in dupes[:10]:
                  print(f"  {e['source']} -> {e['target']} [{e.get('type', '?')}]")
              sys.exit(1)
          print(f"PASS: All {len(edges)} edges are unique (source, target, type).")
          EOF

  generate-main-graph:
    name: Materialize Generated Graph
    runs-on: ubuntu-latest
    needs: build-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build graph
        run: python tools/build_graph.py

      - name: Sync graph UI projection
        run: |
          mkdir -p docs/api
          cp data/SKILLS_GRAPH.json docs/api/graph.json

      - name: Commit updated graph artifacts
        uses: EndBug/add-and-commit@v9
        with:
          add: 'data/SKILLS_GRAPH.json docs/api/graph.json data/SKILLS_GRAPH_STATS.json meta/GRAPH_BUILD_REPORT.md'
          message: 'chore(graph): auto-update generated graph projections [skip ci]'
          default_author: github_actions

  quality-report:
    name: Skill Quality Score
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-validate, generate-main-graph]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate quality index
        run: python tools/quality_score.py

      - name: Commit quality index
        uses: EndBug/add-and-commit@v9
        with:
          add: 'meta/SKILL_QUALITY_INDEX.md'
          message: 'chore(quality): auto-update skill quality index [skip ci]'
          default_author: github_actions
