# ============================================================
# validate-skills.yml
# Full structural validation for every skill .md file.
# Runs on PRs touching skills/**/*.md.
#
# Checks:
#   1. YAML frontmatter has required fields (title, category, level,
#      stability, description, related)
#   2. Body has ## Description and ## Related sections
#   3. File is not trivially short (< 200 chars)
#   4. Frontmatter backfill: adds `added: YYYY-MM` dynamically
#      using the current date if the field is missing
# ============================================================
name: 🔍 Validate Skills

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**/*.md'

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    name: Validate & backfill skill files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed skill files
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^skills/.+\.md$' > changed_skills.txt || true
          echo "Found $(wc -l < changed_skills.txt) changed skill files"
          cat changed_skills.txt

      - name: Validate + backfill frontmatter
        run: |
          python3 - <<'EOF'
          import re, sys
          from datetime import datetime
          from pathlib import Path

          REQUIRED_FRONTMATTER = ["title", "category", "level", "stability", "description", "related"]
          REQUIRED_SECTIONS    = ["## Description", "## Related"]
          errors = []
          backfilled = []

          changed = Path("changed_skills.txt").read_text().splitlines()
          files   = [f for f in changed if f.strip() and Path(f.strip()).exists()]

          for raw_path in files:
              path = Path(raw_path.strip())
              # Guard: only process files inside skills/
              if not str(path).startswith("skills/"):
                  errors.append(f"{path}: path outside skills/ directory — skipping")
                  continue

              content = path.read_text(encoding="utf-8", errors="ignore")

              if len(content.strip()) < 200:
                  errors.append(f"{path}: file too short (< 200 chars), possibly a stub")
                  continue

              # --- Frontmatter check ---
              if not content.startswith("---"):
                  errors.append(f"{path}: missing YAML frontmatter block")
                  continue

              fm_end = content.find("---", 3)
              if fm_end == -1:
                  errors.append(f"{path}: unclosed YAML frontmatter")
                  continue

              fm_block = content[3:fm_end]
              present  = set(re.findall(r'^([\w-]+):', fm_block, re.MULTILINE))
              missing  = [f for f in REQUIRED_FRONTMATTER if f not in present]
              if missing:
                  errors.append(f"{path}: missing frontmatter fields: {', '.join(missing)}")

              # --- Backfill `added` with current YYYY-MM if missing ---
              if "added" not in present:
                  today_ym = datetime.utcnow().strftime("%Y-%m")
                  new_fm   = fm_block.rstrip() + f'\nadded: "{today_ym}"\n'
                  content  = "---" + new_fm + content[fm_end:]
                  path.write_text(content, encoding="utf-8")
                  backfilled.append(str(path))

              # --- Required section headings ---
              for section in REQUIRED_SECTIONS:
                  if section not in content:
                      errors.append(f"{path}: missing section '{section}'")

          if backfilled:
              print(f"Backfilled 'added' field in {len(backfilled)} file(s):")
              for p in backfilled: print(f"  ✏️  {p}")

          if errors:
              print("\nValidation errors:")
              for e in errors: print(f"  ❌ {e}")
              sys.exit(1)
          else:
              print(f"\n✅ {len(files)} skill file(s) validated OK")
          EOF

      - name: Commit backfilled files (if any)
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/
          git diff --staged --quiet && exit 0
          git commit -m 'chore(skills): backfill missing `added` frontmatter field [skip ci]'
          git push origin HEAD:${{ github.head_ref }}
