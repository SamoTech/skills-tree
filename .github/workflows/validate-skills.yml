name: Validate Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'meta/**'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'meta/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate skill files
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Step 0: Compute today's date (used by backfill step) ─────────────
      - name: Compute backfill date
        id: date
        if: github.event_name == 'push'
        run: echo "date=$(date '+%Y-%m')" >> $GITHUB_OUTPUT

      # ── Step 1: Backfill missing "added:" field ──────────────────────────
      # FIX: Use dynamic date (date +%Y-%m) instead of hardcoded "2025-03".
      # FIX: Use Python pathlib for frontmatter editing to eliminate the shell
      #      injection risk that came from passing untrusted filenames to sed.
      - name: Backfill missing Added field (push to main only)
        if: github.event_name == 'push'
        env:
          ADDED_DATE: ${{ steps.date.outputs.date }}
        run: |
          python3 - <<'PYEOF'
          import re, subprocess, os
          from pathlib import Path

          added_date = os.environ["ADDED_DATE"]
          changed = 0

          for f in sorted(Path("skills").rglob("*.md")):
              if "README" in f.name:
                  continue
              text = f.read_text(encoding="utf-8", errors="ignore")
              if re.search(r'^added:', text, re.MULTILINE):
                  continue
              if re.search(r'^\*\*Added:\*\*', text, re.MULTILINE):
                  continue
              if re.search(r'^stability:', text, re.MULTILINE):
                  new_text = re.sub(
                      r'(^stability:.*$)',
                      r'\1\nadded: "' + added_date + '"',
                      text, count=1, flags=re.MULTILINE
                  )
              elif text.startswith("---"):
                  new_text = text.replace("---\n", '---\nadded: "' + added_date + '"\n', 1)
              else:
                  continue
              f.write_text(new_text, encoding="utf-8")
              print(f"Backfilled added field: {f}")
              changed += 1

          if changed == 0:
              print("No backfill needed.")
              exit(0)

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "skills/"], check=True)
          result = subprocess.run(["git", "diff", "--staged", "--quiet"])
          if result.returncode == 0:
              print("Nothing staged after add.")
              exit(0)
          subprocess.run(["git", "commit", "-m", "chore(skills): backfill missing added field [skip ci]"], check=True)
          PYEOF

          for attempt in 1 2 3; do
            git push origin main && {
              echo "\u2705 Backfill pushed (attempt ${attempt})."
              exit 0
            }
            echo "Push failed (attempt ${attempt}/3). Rebasing..."
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "ERROR: All 3 push attempts failed."
          exit 1

      # ── Step 2: Hard validation — structural sections ────────────────────
      - name: Check required sections (hard fail)
        run: |
          echo "Checking skill .md files for required sections..."
          shopt -s globstar
          FAIL=0

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'skills/**/*.md' | grep -v README || true)
            echo "PR mode — checking $(echo "$FILES" | grep -c '\.md' || echo 0) changed skill file(s)."
          else
            FILES=$(find skills -name '*.md' | grep -v README)
            echo "Push mode — full scan of all skill files."
          fi

          for f in $FILES; do
            [ -f "$f" ] || continue
            [[ "$f" == *README* ]] && continue
            if ! grep -qE '(^#{1,3} Description|^\*\*Description)' "$f"; then
              echo "::error file=$f::MISSING 'Description' section (## Description, ### Description, or **Description**)"
              FAIL=1
            fi
            if ! grep -qE '(^#{1,3} Related\b|^\*\*Related)' "$f"; then
              echo "::error file=$f::MISSING 'Related' section (## Related, ### Related Skills, **Related**, etc.)"
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] && echo "All checked skill files have required sections."
          exit $FAIL

      # ── Step 3: Soft validation — frontmatter fields (warn only) ─────────
      - name: Check frontmatter fields (warn only)
        run: |
          echo "Checking frontmatter fields (warnings only)..."
          shopt -s globstar
          WARN=0
          for f in skills/**/*.md; do
            [[ "$f" == *README* ]] && continue
            if ! grep -qE '(^category:|\*\*Category:\*\*)' "$f"; then
              echo "::warning file=$f::MISSING 'category' field"
              WARN=1
            fi
            if ! grep -qE '(^level:|\*\*Skill Level:\*\*)' "$f"; then
              echo "::warning file=$f::MISSING 'level' or 'Skill Level' field"
              WARN=1
            fi
            if ! grep -qE '(^stability:|\*\*Stability:\*\*)' "$f"; then
              echo "::warning file=$f::MISSING 'stability' field"
              WARN=1
            fi
            if ! grep -qE '(^added:|\*\*Added:\*\*)' "$f"; then
              echo "::warning file=$f::MISSING 'added' field — will be auto-backfilled on merge"
              WARN=1
            fi
          done
          [ $WARN -eq 0 ] && echo "All frontmatter fields present."
          exit 0

      # ── Step 4: Check for Example section (warn only) ────────────────────
      - name: Check for Example section (warn only)
        run: |
          shopt -s globstar
          for f in skills/**/*.md; do
            [[ "$f" == *README* ]] && continue
            if ! grep -qE '^#{1,3} (Example|Pattern|Usage)' "$f"; then
              echo "::warning file=$f::No 'Example' / 'Pattern' / 'Usage' section found"
            fi
          done
          exit 0

      # ── Step 5: Broken relative link check ──────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for broken relative links
        run: python3 tools/check_broken_links.py
