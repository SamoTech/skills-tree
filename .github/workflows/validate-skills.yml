# ============================================================
# validate-skills.yml
# Full structural validation for every skill .md file.
# This workflow is intentionally read-only: CI must never mutate a
# contributor branch or silently change skill content during review.
# ============================================================
name: 🔍 Validate Skills

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**/*.md'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate skill files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed skill files
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^skills/.+\.md$' > changed_skills.txt || true
          echo "Found $(wc -l < changed_skills.txt) changed skill files"
          cat changed_skills.txt

      - name: Validate skill files
        run: |
          python3 - <<'PYEOF'
          import re
          import sys
          from pathlib import Path

          REQUIRED_FRONTMATTER = [
              "title", "category", "level", "stability", "description", "related"
          ]
          REQUIRED_SECTIONS = ["## Description", "## Related"]
          errors = []

          changed = Path("changed_skills.txt").read_text().splitlines()
          files = [f for f in changed if f.strip() and Path(f.strip()).exists()]

          for raw_path in files:
              path = Path(raw_path.strip())
              if not str(path).startswith("skills/"):
                  errors.append(f"{path}: path outside skills/ directory")
                  continue

              content = path.read_text(encoding="utf-8", errors="strict")

              if len(content.strip()) < 200:
                  errors.append(f"{path}: file too short (< 200 chars), possibly a stub")
                  continue

              if not content.startswith("---"):
                  errors.append(f"{path}: missing YAML frontmatter block")
                  continue

              fm_end = content.find("---", 3)
              if fm_end == -1:
                  errors.append(f"{path}: unclosed YAML frontmatter")
                  continue

              fm_block = content[3:fm_end]
              present = set(re.findall(r'^([\w-]+):', fm_block, re.MULTILINE))
              missing = [field for field in REQUIRED_FRONTMATTER if field not in present]
              if missing:
                  errors.append(
                      f"{path}: missing frontmatter fields: {', '.join(missing)}"
                  )

              for section in REQUIRED_SECTIONS:
                  if section not in content:
                      errors.append(f"{path}: missing section '{section}'")

          if errors:
              print("\nValidation errors:")
              for error in errors:
                  print(f"  ❌ {error}")
              sys.exit(1)

          print(f"\n✅ {len(files)} skill file(s) validated without repository mutation")
          PYEOF
