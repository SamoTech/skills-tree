name: Used-In Tracker

on:
  issues:
    types: [opened, edited]
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Serialize runs of THIS workflow on the same ref so concurrent
# scheduled triggers do not race when pushing back to main.
concurrency:
  group: used-in-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-used-in:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Used-In submissions and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 tools/used_in_tracker.py

      - name: Commit README changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "chore(used-in): update Used-In tracker in README [skip ci]"
          for attempt in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "ERROR: Push failed after 3 attempts."
          exit 1
