name: temp-regen
on:
  push:
    branches: [skills/expansion-2026-11-06-b1]
permissions:
  contents: write
concurrency:
  group: temp-regen-b1
  cancel-in-progress: false
jobs:
  regen:
    if: github.ref == 'refs/heads/skills/expansion-2026-11-06-b1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: skills/expansion-2026-11-06-b1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge latest main
        continue-on-error: true
        run: |
          git fetch origin main
          git merge origin/main -X theirs --no-edit || echo "merge failed or nothing to merge"
      - name: Install tool deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema networkx markdown requests || true
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
      - name: Re-derive drifted packages via project()/write_projection()
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys, pathlib
          sys.path.insert(0, "tools")
          import generate_agent_skills as g
          from pathlib import Path
          skipped = []
          derived = 0
          for skill in g.iter_skill_files("skills") if hasattr(g, "iter_skill_files") else []:
              pass
          print("fallback to generate --audit path if helpers differ")
          PY
          python tools/generate_agent_skills.py --write-eligible || echo "generate --write-eligible exited nonzero"
      - name: Run graph build
        continue-on-error: true
        run: python tools/build_graph.py || echo "build_graph failed"
      - name: Run search index build
        continue-on-error: true
        run: python tools/build_search_index.py || echo "build_search_index failed"
      - name: Run skills export
        continue-on-error: true
        run: python tools/export_skills.py || echo "export_skills failed"
      - name: Verify JSON-LD export
        continue-on-error: true
        run: python tools/verify_jsonld_export.py || echo "verify_jsonld_export failed"
      - name: Run skill quality check
        continue-on-error: true
        run: python tools/check_skill_quality.py || echo "check_skill_quality failed"
      - name: Update README counts
        continue-on-error: true
        run: python tools/update_readme_counts.py || echo "update_readme_counts failed"
      - name: Sync badges
        continue-on-error: true
        run: python tools/sync_badges.py || echo "sync_badges failed"
      - name: Capture distribution audit
        continue-on-error: true
        run: |
          { echo "== generate --audit =="; python tools/generate_agent_skills.py --audit; echo "== validate =="; python tools/validate_agent_skills.py; echo "== reconcile --check =="; python tools/reconcile_agent_skills.py --check; } > meta/AUDIT-DEBUG.txt 2>&1 || true
      - name: Record lychee report
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --exclude 'file://.*' --timeout 30 --max-retries 2 --max-cache-size 0 --no-progress './skills/**/*.md'
          fail: false
          output: meta/LYCHEE-REPORT.md
          format: markdown
      - name: Commit regenerated projections and diagnostics
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(regen): deterministic projection refresh after main merge"
            git pull --rebase origin skills/expansion-2026-11-06-b1 || true
            git push origin skills/expansion-2026-11-06-b1
          fi
