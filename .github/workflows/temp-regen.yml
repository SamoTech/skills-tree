name: temp-regen
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
jobs:
  regen:
    if: github.head_ref == 'skills/expansion-2026-10-28-b1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pyyaml jsonschema markdown networkx
      - name: Build graph
        run: |
          python tools/build_graph.py
          mkdir -p docs/api
          cp data/SKILLS_GRAPH.json docs/api/graph.json
      - name: Build search index
        run: |
          python tools/build_search_index.py --skills-root skills/ --output docs/search-index.json --package-output data/search-index.json
      - name: Export skills API
        run: |
          python3 tools/export_skills.py
          python3 tools/verify_jsonld_export.py
      - name: Quality report
        run: python3 tools/check_skill_quality.py
      - name: README counts
        run: python3 tools/update_readme_counts.py
      - name: Link report
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          format: markdown
          output: meta/LYCHEE-REPORT.md
        continue-on-error: true
      - name: Commit regenerated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore(regen): deterministic projection refresh" && git push)
