name: temp-regen
# temporary branch-local regen + diagnostics for the 2026-11-03 batch 2 expansion
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
jobs:
  regen:
    if: github.head_ref == 'skills/expansion-2026-11-03-b2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pyyaml jsonschema markdown networkx
      - name: Regenerate drifted deterministic packages (project() derivation)
        run: |
          { python - <<'PYEOF'
          import sys
          sys.path.insert(0, "tools")
          from pathlib import Path
          import generate_agent_skills as g
          root = Path(".").resolve()
          report = g.audit(root)
          colliding = set(report["name_collisions"])
          files = sorted(p for p in (root / "skills").rglob("*.md") if p.name.lower() != "readme.md")
          written = []
          for p in files:
              item = g.project(p, root)
              if not item.eligible or item.name in colliding:
                  continue
              dest = root / "agent-skills" / item.name / "SKILL.md"
              expected = item.content.rstrip() + "\n"
              if dest.exists() and dest.read_text(encoding="utf-8") == expected:
                  continue
              g.write_projection(root, item)
              written.append(item.name)
          print(f"rewrote {len(written)} drifted packages: {', '.join(written)}")
          PYEOF
          echo "generate_exit=$?"; } > meta/GENERATE-WRITE.txt 2>&1 || true
        continue-on-error: true
      - name: Build graph
        run: |
          python tools/build_graph.py
          mkdir -p docs/api
          cp data/SKILLS_GRAPH.json docs/api/graph.json
      - name: Dangling target diagnostic
        run: |
          python - <<'EOF' > meta/GRAPH-DANGLING.txt 2>&1 || true
          import json, sys
          from pathlib import Path
          graph_path = Path("data/SKILLS_GRAPH.json")
          data = json.loads(graph_path.read_text())
          node_ids = {n["id"] for n in data.get("nodes", [])}
          dangling = [e for e in data.get("edges", []) if e["target"] not in node_ids]
          if dangling:
              print(f"FAIL: {len(dangling)} edges with dangling (missing) target node IDs.")
              for e in dangling[:50]:
                  print(f"  {e['source']} -> {e['target']} [{e.get('type', '?')}]")
              sys.exit(1)
          print(f"PASS: All {len(data.get('edges', []))} edge targets are valid node IDs.")
          EOF
        continue-on-error: true
      - name: Export skills and search index
        run: |
          { python tools/export_skills.py; echo "export_exit=$?"; } > meta/EXPORT-CHECK.txt 2>&1 || true
          { python tools/build_search_index.py; echo "index_exit=$?"; } > meta/INDEX-CHECK.txt 2>&1 || true
          { python tools/check_skill_quality.py; echo "quality_exit=$?"; } > meta/QUALITY-CHECK.txt 2>&1 || true
          { python tools/update_readme_counts.py; echo "readme_exit=$?"; } > meta/README-COUNTS.txt 2>&1 || true
        continue-on-error: true
      - name: Audit check diagnostics
        run: |
          { python tools/validate_agent_skills.py; echo "validate_exit=$?"; } > meta/VALIDATE-CHECK.txt 2>&1 || true
          { python tools/reconcile_agent_skills.py --check; echo "reconcile_exit=$?"; } > meta/RECONCILE-CHECK.txt 2>&1 || true
        continue-on-error: true
      - name: Commit regen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore(regen): deterministic projection refresh + diagnostics" && git push)
