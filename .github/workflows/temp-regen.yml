name: Temp Regen Batch 1

# Temporary: regenerate stale derived projections on the batch-1 expansion
# branch after dangling-link fixes edited 5 canonical skill files.
# Guarded to this branch only; remove after batch 1 merges.

on:
  push:
    branches: [skills/expansion-2026-11-05-b1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-regen-b1
  cancel-in-progress: false

jobs:
  regen:
    name: Regenerate stale derived artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: skills/expansion-2026-11-05-b1
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet PyYAML==6.0.3

      - name: Rebuild search index
        run: |
          python tools/build_search_index.py \
            --skills-root skills/ \
            --output docs/search-index.json \
            --package-output data/search-index.json

      - name: Rebuild skills API export
        run: python3 tools/export_skills.py

      - name: Validate JSON-LD export
        run: python3 tools/verify_jsonld_export.py

      - name: Rebuild skills graph
        run: python tools/build_graph.py

      - name: Mirror graph projection to docs/api
        run: cp data/SKILLS_GRAPH.json docs/api/graph.json

      - name: Commit refreshed projections
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/search-index.json data/search-index.json docs/api data/SKILLS_GRAPH.json data/SKILLS_GRAPH_STATS.json
          if git diff --staged --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: regenerate stale derived artifacts after batch-1 link fixes"
          git push origin HEAD:skills/expansion-2026-11-05-b1
