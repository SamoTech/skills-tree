name: Temp regen - modernization inventory (branch-local steward tooling)

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temp-regen-modernization-inventory
  cancel-in-progress: false

jobs:
  regen:
    if: github.event.pull_request.head.ref == 'counsel/modernization-inventory'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tool dependencies
        run: python -m pip install --quiet pyyaml pytest jsonschema
      - name: Run deterministic modernization inventory
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          python tools/modernization_inventory.py 2>&1 | tee meta/INVENTORY-LOG.txt
          test -f meta/MODERNIZATION-INVENTORY.md
      - name: Commit generated inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "::warning::pwd=$(pwd) files=$(ls meta | head -10 | tr "Q" " ")"
          if ! add_out="$(git add meta/MODERNIZATION-INVENTORY.md meta/INVENTORY-LOG.txt 2>&1)"; then
            echo "::error title=add-failed::$add_out"
            exit 1
          fi
          echo "::warning::add-ok staged=$(git status --porcelain | head -5)"
          if ! git diff --cached --quiet; then
            if ! c_out="$(git commit -m "chore(regen): deterministic modernization inventory refresh" 2>&1)"; then
              echo "::error title=commit-failed::$c_out"
              exit 1
            fi
            echo "::warning::commit-ok"
          else
            echo "::warning::nothing-cached"
          fi
      - name: Validate freshness contract inline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          code=0
          python -m pytest tests/test_modernization_inventory.py -q > meta/INVENTORY-TEST.txt 2>&1 || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error title=pytest-failed::code=$code $(tail -8 meta/INVENTORY-TEST.txt)"
            exit 1
          fi
          head -3 meta/INVENTORY-TEST.txt
      - name: Add validation record and push
        run: |
          git add meta/INVENTORY-TEST.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(regen): add validation log" || true
          fi
          if ! push_out="$(git push origin HEAD:counsel/modernization-inventory 2>&1)"; then
            echo "::error title=push-failed::$(echo "$push_out" | head -1)"
            exit 1
          fi
          echo "push ok: $push_out"
