name: temp-regen
# temporary branch-local merge + regen for the 2026-11-08 batch-1 expansion (50 skills)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [skills/expansion-2026-11-08-b1]
jobs:
  merge-and-regen:
    if: github.head_ref == 'skills/expansion-2026-11-08-b1' || github.ref == 'refs/heads/skills/expansion-2026-11-08-b1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge latest main (-X theirs for generated projections and docs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit -X theirs
          git push
      - name: Install deps
        run: pip install pyyaml jsonschema markdown networkx
      - name: Rewrite drifted agent-skills packages deterministically
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from generate_agent_skills import audit, project, write_projection
          root = Path(".").resolve()
          report = audit(root)
          colliding = set(report["name_collisions"].keys())
          fixed = 0
          for path in sorted((root / "skills").rglob("*.md")):
              if path.name.lower() == "readme.md":
                  continue
              item = project(path, root)
              if not item.eligible or item.name in colliding:
                  continue
              dest = root / "agent-skills" / item.name / "SKILL.md"
              expected = item.content.rstrip() + "\n"
              if not dest.exists() or dest.read_text(encoding="utf-8") != expected:
                  write_projection(root, item)
                  fixed += 1
          print(f"Rewrote {fixed} packages")
          PY
      - name: Build graph
        run: |
          python tools/build_graph.py
          mkdir -p docs/api
          cp data/SKILLS_GRAPH.json docs/api/graph.json
      - name: Build search index
        run: python tools/build_search_index.py --skills-root skills/ --output docs/search-index.json --package-output data/search-index.json
      - name: Export skills API
        run: |
          python3 tools/export_skills.py
          python3 tools/verify_jsonld_export.py
      - name: Quality report
        run: python3 tools/check_skill_quality.py
      - name: README counts
        run: python3 tools/update_readme_counts.py
      - name: Sync badges
        run: python3 tools/sync_badges.py
      - name: Link report (advisory, scoped and time-bounded to the 50 new batch-1 skill files)
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          format: markdown
          output: meta/LYCHEE-REPORT.md
          args: >-
            --no-progress
            --timeout 5
            --max-retries 0
            --concurrency 16
            skills/01-perception/pdf-invisible-text-layer-prompt-injection-detection.md skills/01-perception/smartwatch-cuffless-blood-pressure-signal-reading.md skills/02-reasoning/ipo-valuation-range-reasoning.md skills/02-reasoning/eval-awareness-behavior-calibration-reasoning.md skills/02-reasoning/ai-auditor-recall-false-positive-tradeoff-reasoning.md skills/03-memory/persistent-teammate-context-retention-scoping.md skills/03-memory/adaptive-behavior-refinement-memory.md skills/03-memory/workspace-shared-context-memory.md skills/04-action-execution/text-channel-shopping-agent-purchase-execution.md skills/04-action-execution/market-order-teammate-monitoring-execution.md skills/04-action-execution/agent-driven-experiment-reproduction-execution.md skills/05-code/stageshow-product-demo-building.md skills/05-code/coding-harness-unattended-reliability-configuration.md skills/05-code/claude-code-permission-persistence-hardening.md skills/06-communication/teammate-trial-outcome-report-writing.md skills/06-communication/persistent-workspace-confirmation-ux-writing.md skills/07-tool-use/mcp-connector-followup-switch-detection.md skills/07-tool-use/teammate-role-tool-grant-scoping.md skills/07-tool-use/llms-txt-mcp-server-discovery-usage.md skills/08-multimodal/kling-4-short-clip-generation-evaluation.md skills/08-multimodal/digital-tower-camera-overlay-interpretation.md skills/08-multimodal/laboratory-assay-image-interpretation.md skills/08-multimodal/million-token-multimodal-context-budgeting.md skills/09-agentic-patterns/persistent-teammate-role-pattern.md skills/09-agentic-patterns/mass-agent-delegation-feasibility-estimation.md skills/09-agentic-patterns/reverse-game-theory-agent-checking-pattern.md skills/10-computer-use/product-demo-motion-capture-verification.md skills/11-web/agent-readable-product-catalog-audit.md skills/11-web/assistant-search-share-estimation.md skills/12-data/teammate-credit-consumption-accounting.md skills/12-data/semiconductor-lead-time-trend-analysis.md skills/12-data/quarterly-revenue-growth-deceleration-analysis.md skills/13-creative/agent-rendered-vertical-short-production.md skills/13-creative/agent-workspace-environment-design.md skills/14-security/artex-secret-harvest-attack-recovery-operations.md skills/14-security/public-settings-secret-leak-sweep-operations.md skills/14-security/gpu-confidential-computing-readiness-verification.md skills/14-security/k-12-ai-deployment-child-safety-guardrails.md skills/15-orchestration/teammate-parallel-thread-monitoring-orchestration.md skills/15-orchestration/unattended-coding-agent-supervision-orchestration.md skills/15-orchestration/gemini-at-work-rollout-orchestration.md skills/16-domain-specific/ex-ussr-kinship-evidence-research.md skills/16-domain-specific/reachy-mini-mobility-update-deployment.md skills/16-domain-specific/police-drone-program-procurement-review.md skills/16-domain-specific/ai-safety-advocacy-campaign-outcome-analysis.md skills/16-domain-specific/ai-growth-slowness-macro-risk-analysis.md skills/17-infrastructure/southeast-asia-datacenter-buildout-constraint-analysis.md skills/17-infrastructure/wind-linked-datacenter-campus-power-provisioning.md skills/17-infrastructure/satellite-constellation-onboard-ai-beam-routing-provisioning.md skills/17-infrastructure/super-compute-site-permit-alignment-review.md
        continue-on-error: true
      - name: Distribution audit capture
        run: |
          python3 tools/generate_agent_skills.py --audit > meta/AUDIT-REPORT.md
          python3 tools/validate_agent_skills.py > meta/AUDIT-VALIDATE.txt
          python3 tools/reconcile_agent_skills.py --check > meta/AUDIT-DRIFT.md
        continue-on-error: true
      - name: Commit regenerated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore(regen): deterministic projection refresh after main merge" && git push)
