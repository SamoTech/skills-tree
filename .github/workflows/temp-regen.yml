name: Temporary branch regen (expansion 2026-10-20 b1v2)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  regen:
    if: github.head_ref == 'skills/expansion-2026-10-20-b1v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install PyYAML==6.0.3 jsonschema
      - name: Regenerate search index
        run: python tools/build_search_index.py --skills-root skills/ --output docs/search-index.json --package-output data/search-index.json
      - name: Regenerate skills API export
        run: python3 tools/export_skills.py && python3 tools/verify_jsonld_export.py
      - name: Regenerate graph
        run: python tools/build_graph.py && mkdir -p docs/api && cp data/SKILLS_GRAPH.json docs/api/graph.json
      - name: Regenerate quality report
        run: python3 tools/check_skill_quality.py
      - name: Regenerate README counts
        run: python3 tools/update_readme_counts.py
      - name: Link-check report (diagnosis only)
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          format: markdown
          output: meta/LYCHEE-REPORT.md
      - name: Commit regenerated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(regen): refresh derived projections at branch head" || echo "nothing to commit"
          git push origin HEAD:${{ github.head_ref }}
