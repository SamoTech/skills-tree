name: temp-regen

on:
  push:
    branches: ['skills/expansion-2026-11-05-b2']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: skills/expansion-2026-11-05-b2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.3
      - run: python tools/build_search_index.py --skills-root skills/ --output docs/search-index.json --package-output data/search-index.json
      - run: python3 tools/export_skills.py
      - run: python3 tools/verify_jsonld_export.py
      - run: python tools/build_graph.py
      - run: cp data/SKILLS_GRAPH.json docs/api/graph.json
      - name: Commit regenerated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/search-index.json data/search-index.json docs/api data || true
          git commit -m "chore: regenerate derived projections for expansion branch" || echo "nothing to commit"
          git push
