name: Temp regen - modernization inventory (branch-local steward tooling)

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temp-regen-modernization-inventory
  cancel-in-progress: false

jobs:
  regen:
    if: github.event.pull_request.head.ref == 'counsel/modernization-inventory'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tool dependencies
        run: python -m pip install --quiet pyyaml pytest jsonschema
      - name: Run deterministic modernization inventory
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          python tools/modernization_inventory.py 2>&1 | tee meta/INVENTORY-LOG.txt
          test -f meta/MODERNIZATION-INVENTORY.md
      - name: Commit generated inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! add_out="$(git add meta/MODERNIZATION-INVENTORY.md meta/INVENTORY-LOG.txt meta/INVENTORY-TEST.txt 2>&1)"; then
            echo "::error title=add-failed::$(echo "$add_out" | head -1)"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "::notice::no inventory changes; nothing to commit"
          else
            git commit -m "chore(regen): deterministic modernization inventory refresh"
          fi
      - name: Validate freshness contract inline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/test_modernization_inventory.py -q > meta/INVENTORY-TEST.txt 2>&1
          tail -3 meta/INVENTORY-TEST.txt
      - name: Push generated inventory
        run: |
          if ! push_out="$(git push origin HEAD:counsel/modernization-inventory 2>&1)"; then
            echo "::error title=push-failed::$(echo "$push_out" | head -1)"
            exit 1
          fi
          echo "push ok: $push_out"
