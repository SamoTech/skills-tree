name: Version Stats

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/*.md'
  schedule:
    - cron: '0 4 * * 1'  # Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs of THIS workflow on the same ref so concurrent
# scheduled triggers do not race when pushing back to main.
concurrency:
  group: version-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-versioning-stats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Count skill versions and update VERSIONING.md
        run: python3 tools/version_stats.py

      - name: Commit updated VERSIONING.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/VERSIONING.md
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "chore(versioning): auto-update version distribution stats [skip ci]"
          for attempt in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "ERROR: Push failed after 3 attempts."
          exit 1
