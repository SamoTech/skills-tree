name: Version Stats

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/*.md'
  schedule:
    - cron: '0 4 * * 1'  # Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs of THIS workflow on the same ref so concurrent
# scheduled triggers do not race when pushing back to main.
concurrency:
  group: auto-commit-main
  queue: max
  cancel-in-progress: false

jobs:
  update-versioning-stats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Count skill versions and update VERSIONING.md
        run: python3 tools/version_stats.py

      - name: Publish generated changes through protected-main PR
        env:
          GENERATED_BRANCH: automation/generated-version-stats
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/VERSIONING.md
          git diff --staged --quiet && echo "No generated changes." && exit 0
          git commit -m "chore(versioning): update version stats [skip ci]"
          git push --force origin HEAD:"$GENERATED_BRANCH"

          if gh pr list --base main --head "$GENERATED_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create               --base main               --head "$GENERATED_BRANCH"               --title "chore(versioning): update version stats"               --body "Update version distribution stats and publish them through a protected-main PR.

          This automation branch exists because main is protected. Merge only through the normal PR checks."
          else
            echo "Open automation PR already exists for $GENERATED_BRANCH."
          fi
