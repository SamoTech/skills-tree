name: Generate Search Index

# Rebuilds the Lunr.js search index (docs/search-index.json) whenever
# skill files or their metadata change on main.
#
# The index is consumed by the static site's client-side search.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/*.md'
      - 'meta/skill-schema.json'
      - 'tools/build_search_index.py'
      - 'tools/skill_corpus.py'
  workflow_dispatch:

concurrency:
  group: auto-commit-main
  queue: max
  cancel-in-progress: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  index:
    name: Rebuild search index
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install indexer dependencies
        run: pip install --quiet PyYAML==6.0.3

      - name: Build search index
        run: |
          python tools/build_search_index.py \
            --skills-root skills/ \
            --output docs/search-index.json \
            --package-output data/search-index.json

      - name: Publish generated changes through protected-main PR
        env:
          GENERATED_BRANCH: automation/generated-search-index
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/search-index.json data/search-index.json
          git diff --staged --quiet && echo "No generated changes." && exit 0
          git commit -m "chore(search): rebuild search index [skip ci]"
          git push --force origin HEAD:"$GENERATED_BRANCH"

          if gh pr list --base main --head "$GENERATED_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create               --base main               --head "$GENERATED_BRANCH"               --title "chore(search): rebuild search index"               --body "Generate the search index projection and publish it through a protected-main PR.

          This automation branch exists because main is protected. Merge only through the normal PR checks."
          else
            echo "Open automation PR already exists for $GENERATED_BRANCH."
          fi
