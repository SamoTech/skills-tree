name: Generate Search Index

# Rebuilds the Lunr.js search index (docs/search-index.json) whenever
# skill files or their metadata change on main.
#
# The index is consumed by the static site's client-side search.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/*.md'
      - 'meta/skill-schema.json'
  workflow_dispatch:

concurrency:
  group: generate-search-index-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  index:
    name: Rebuild search index
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install indexer dependencies
        run: pip install --quiet PyYAML==6.0.2

      - name: Build search index
        run: |
          python tools/build_search_index.py \
            --skills-root skills/ \
            --output docs/search-index.json

      - name: Commit search index
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/search-index.json
          git diff --staged --quiet && echo "Index unchanged." && exit 0
          git commit -m "chore(search): rebuild search index [skip ci]"
          git push origin main
