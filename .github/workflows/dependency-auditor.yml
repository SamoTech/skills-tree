name: Dependency Auditor

on:
  workflow_dispatch:
    inputs:
      root:
        description: 'Skills directory to audit (default: skills)'
        required: false
        default: 'skills'
      dry_run:
        description: 'Dry run — print results, do not open PR'
        required: false
        default: 'false'
  schedule:
    - cron: '0 2 * * 0'

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
