name: Validate Evaluations

on:
  push:
    paths:
      - '.github/workflows/validate-evaluations.yml'
      - 'intelligence/ontology/evaluation_ontology.json'
      - 'intelligence/ontology/capability_ontology.json'
      - 'intelligence/corpus/entries/**/*.json'
  pull_request:
    paths:
      - 'intelligence/ontology/evaluation_ontology.json'
      - 'intelligence/ontology/capability_ontology.json'
      - 'intelligence/corpus/entries/**/*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-evaluations:
    name: Evaluation Ontology Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate evaluation ontology against capability ontology
        run: |
          python - <<'PYEOF'
          import json
          import os
          import sys

          EVAL_PATH = 'intelligence/ontology/evaluation_ontology.json'
          CAP_PATH = 'intelligence/ontology/capability_ontology.json'

          if not os.path.exists(EVAL_PATH):
              print(f'SKIP: {EVAL_PATH} not found — no evaluations to validate yet')
              sys.exit(0)
          if not os.path.exists(CAP_PATH):
              print(f'ERROR: {CAP_PATH} not found — cannot validate evaluations without capability registry')
              sys.exit(1)

          with open(EVAL_PATH, encoding='utf-8') as f:
              eval_data = json.load(f)
          with open(CAP_PATH, encoding='utf-8') as f:
              cap_data = json.load(f)

          cap_registry = {}
          if isinstance(cap_data, dict) and 'capabilities' in cap_data:
              for cap in cap_data['capabilities']:
                  cap_registry[cap['cap_id']] = cap
          elif isinstance(cap_data, list):
              for cap in cap_data:
                  cap_registry[cap['cap_id']] = cap
          else:
              for key, value in cap_data.items():
                  if key.startswith('CAP-'):
                      cap_registry[key] = value if isinstance(value, dict) else {'name': value}

          evaluations = eval_data.get(
              'capability_evaluation_mappings',
              eval_data.get('evaluations', eval_data if isinstance(eval_data, list) else [])
          )
          if not evaluations:
              print('ERROR: evaluation ontology contains no capability evaluation mappings')
              sys.exit(1)

          errors = []
          for entry in evaluations:
              cap_id = entry.get('cap_id', 'UNKNOWN')
              eval_name = entry.get('name', '')
              for field in ('cap_id', 'name', 'validation_method'):
                  if not entry.get(field):
                      errors.append(f'[{cap_id}] MISSING REQUIRED FIELD: {field}')
              if cap_id not in cap_registry:
                  errors.append(f'[{cap_id}] CAPABILITY DOES NOT EXIST in capability_ontology.json')
                  continue
              canonical_name = cap_registry[cap_id].get('name', '')
              if eval_name != canonical_name:
                  errors.append(
                      f'[{cap_id}] NAME MISMATCH — eval_ontology has "{eval_name}" '
                      f'but capability_ontology has "{canonical_name}"'
                  )
              if not entry.get('primary_metrics') and not entry.get('metrics') and not entry.get('evaluation_metrics'):
                  errors.append(f'[{cap_id}] NO METRICS DEFINED')
              if entry.get('minimum_required_score') is None and entry.get('min_required_score') is None and entry.get('threshold') is None:
                  errors.append(f'[{cap_id}] NO THRESHOLD DEFINED')
              if not str(entry.get('validation_method', '')).strip():
                  errors.append(f'[{cap_id}] VALIDATION_METHOD is empty or missing')

          if errors:
              print(f'FAILED: {len(errors)} evaluation ontology error(s)')
              for error in errors:
                  print(f'  ERROR: {error}')
              sys.exit(1)

          print(f'PASSED: {len(evaluations)} evaluation mappings are structurally linked to canonical capabilities')
          PYEOF

      - name: Check P0 capabilities are evaluated
        run: |
          python - <<'PYEOF'
          import json
          import sys
          from pathlib import Path

          eval_path = Path('intelligence/ontology/evaluation_ontology.json')
          corpus_dir = Path('intelligence/corpus/entries')

          if not eval_path.exists():
              print(f'SKIP: {eval_path} not found')
              sys.exit(0)

          corpus_files = sorted(corpus_dir.rglob('*.json'))
          if not corpus_files:
              print(f'ERROR: No corpus entries found under {corpus_dir}')
              sys.exit(1)

          eval_data = json.loads(eval_path.read_text(encoding='utf-8'))
          evaluations = eval_data.get('capability_evaluation_mappings', eval_data.get('evaluations', []))
          evaluated_caps = {
              entry.get('cap_id')
              for entry in evaluations
              if entry.get('cap_id')
          }

          missing = []
          for corpus_file in corpus_files:
              corpus = json.loads(corpus_file.read_text(encoding='utf-8'))
              entry_id = corpus.get('entry_id', corpus_file.stem)
              for capability in corpus.get('required_capabilities', []):
                  if capability.get('tier') == 'P0' and capability.get('cap_id') not in evaluated_caps:
                      missing.append(
                          f"{entry_id}: {capability.get('cap_id')} ({capability.get('name', '')})"
                      )

          if missing:
              print(f'WARNING: {len(missing)} P0 capability(ies) have no evaluation mapping')
              for item in missing:
                  print(f'  WARN: {item}')
              print('P0 mapping remains an evidence gap; no coverage claim is made.')
          else:
              print('PASSED: All P0 capabilities in corpus have evaluation mappings')
          PYEOF

      - name: Validate declared evaluation freshness
        run: |
          python - <<'PYEOF'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          paths = [
              Path('intelligence/ontology/evaluation_ontology.json'),
              *sorted(Path('intelligence/corpus/entries').rglob('*.json')),
          ]
          errors = []
          overdue = []

          for path in paths:
              data = json.loads(path.read_text(encoding='utf-8'))
              last = data.get('last_reviewed_at')
              due = data.get('review_due_at')
              if not last or not due:
                  errors.append(f'{path}: missing last_reviewed_at or review_due_at')
                  continue

              try:
                  reviewed = datetime.fromisoformat(last.replace('Z', '+00:00'))
                  review_due = datetime.fromisoformat(due.replace('Z', '+00:00'))
              except ValueError as exc:
                  errors.append(f'{path}: invalid timestamp: {exc}')
                  continue

              if reviewed.tzinfo is None or review_due.tzinfo is None:
                  errors.append(f'{path}: freshness timestamps must include timezone')
              if review_due < reviewed:
                  errors.append(f'{path}: review_due_at precedes last_reviewed_at')
              if review_due < now:
                  overdue.append(f'{path}: review_due_at={due}')

          if errors:
              print(f'FAILED: {len(errors)} freshness metadata error(s)')
              for error in errors:
                  print(f'  ERROR: {error}')
              raise SystemExit(1)

          if overdue:
              print(f'WARNING: {len(overdue)} evaluation/corpus record(s) are past their declared review_due_at')
              for item in overdue:
                  print(f'  WARN: {item}')
              print('No review dates are rewritten automatically; overdue status remains explicit evidence of freshness debt.')
          else:
              print(f'PASSED: freshness metadata is structurally valid and not overdue for {len(paths)} records')
          PYEOF

      - name: Summary
        if: always()
        run: |
          echo "Evaluation validation complete."
          echo "Evaluation ontology linkage, P0 coverage, and declared freshness were checked."
          echo "P0 and freshness warnings remain evidence signals and do not fabricate coverage or currentness."
          echo "Reference: meta/MOST-WANTED-SKILLS.md"
