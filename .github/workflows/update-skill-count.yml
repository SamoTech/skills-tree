name: Update Skill Count Badge

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/*.md'
  schedule:
    - cron: '0 3 * * 1'   # Monday 03:00 UTC (before all other Monday jobs)
  workflow_dispatch:

permissions:
  contents: write


# Serialize runs of THIS workflow on the same ref so concurrent
# scheduled triggers do not race when pushing back to main.
# Distinct workflow classes (graph, exports, badges, …) intentionally
# use different groups so they can still run in parallel.
concurrency:
  group: auto-commit-main
  queue: max
  cancel-in-progress: false

jobs:
  count-and-update:
    name: Count skills & update README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch README
        run: python3 tools/update_readme_counts.py

      - name: Publish generated changes through protected-main PR
        env:
          GENERATED_BRANCH: automation/generated-skill-count
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet && echo "No generated changes." && exit 0
          git commit -m "chore: sync README skill counts [skip ci]"
          git push --force origin HEAD:"$GENERATED_BRANCH"

          if gh pr list --base main --head "$GENERATED_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create               --base main               --head "$GENERATED_BRANCH"               --title "chore: sync README skill counts"               --body "Synchronize README skill counts through a protected-main PR.

          This automation branch exists because main is protected. Merge only through the normal PR checks."
          else
            echo "Open automation PR already exists for $GENERATED_BRANCH."
          fi