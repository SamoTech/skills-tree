name: Update Skill Count Badge

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/*.md'
  schedule:
    - cron: '0 3 * * 1'   # Monday 03:00 UTC (before all other Monday jobs)
  workflow_dispatch:

permissions:
  contents: write


# Serialize runs of THIS workflow on the same ref so concurrent
# scheduled triggers do not race when pushing back to main.
# Distinct workflow classes (graph, exports, badges, …) intentionally
# use different groups so they can still run in parallel.
concurrency:
  group: auto-commit-main
  queue: max
  cancel-in-progress: false

jobs:
  count-and-update:
    name: Count skills & update README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch README
        run: python3 tools/update_readme_counts.py

      - name: Commit & push with rebase retry
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Skill count unchanged — no commit needed."
            exit 0
          fi
          git commit -m "chore: sync README skill counts [skip ci]"
          for attempt in 1 2 3 4 5; do
            git push origin main && {
              echo "✅ Pushed (attempt ${attempt})."
              exit 0
            }
            echo "Push rejected (attempt ${attempt}/5) — rebasing..."
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "ERROR: All push attempts failed."
          exit 1
