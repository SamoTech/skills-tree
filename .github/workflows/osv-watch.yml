name: OSV Watch

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print hits, do not update badges)'
        required: false
        default: 'false'
      rehydrate_sbom:
        description: 'Also rehydrate Yellow badges for SBOM skills (fix stale Grey badges)'
        required: false
        default: 'false'

permissions: {}

jobs:
  osv-watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
