# osv-watch.yml
#
# Phase 2 of the Dependency Watchdog pipeline.
# Queries the OSV (Open Source Vulnerabilities) database for every
# package referenced in the skills SBOM and updates badge JSON files.
#
# Badge states:
#   Green  (verified)  - package version in frontmatter has no known CVEs
#   Yellow (advisory)  - CVE exists but skill pins a patched version
#   Red    (critical)  - skill pins a version with an active CVE
#   Grey   (unscanned) - no dependency data in frontmatter
#
# Runs:
#   - On push to main (skill SBOM changed)
#   - Weekly Sunday 03:00 UTC (catch newly published CVEs)
#   - On workflow_dispatch

name: OSV Watch

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/osv-watch.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  osv-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run OSV scan
        id: osv-scan
        run: python3 tools/osv_watch_scan.py

      - name: Commit badge updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/badges/
          git diff --staged --quiet && echo "No badge changes." && exit 0
          git commit -m "chore(badges): osv-watch badge update [skip ci]"
          for attempt in 1 2 3; do
            git push origin main && {
              echo "Badge push succeeded (attempt ${attempt})."
              exit 0
            }
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "ERROR: Push failed after 3 attempts."
          exit 1

      - name: Upload OSV report
        uses: actions/upload-artifact@v4
        with:
          name: osv-report
          path: osv-report.json

      - name: Summary
        run: |
          echo "### OSV Watch Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f osv-report.json ]; then
            python3 tools/osv_watch_summary.py >> $GITHUB_STEP_SUMMARY
          fi
