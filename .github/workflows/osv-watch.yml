# osv-watch.yml
name: OSV Watch
on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/osv-watch.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-commit-main
  queue: max
  cancel-in-progress: false
jobs:
  osv-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests httpx
      - name: Run OSV scan
        id: osv-scan
        run: python3 tools/osv_watch_scan.py
      - name: Publish generated changes through protected-main PR
        env:
          GENERATED_BRANCH: automation/generated-osv-badges
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/
          git diff --staged --quiet && echo "No generated changes." && exit 0
          git commit -m "chore(badges): osv-watch badge update [skip ci]"
          git push --force origin HEAD:"$GENERATED_BRANCH"

          if gh pr list --base main --head "$GENERATED_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create               --base main               --head "$GENERATED_BRANCH"               --title "chore(badges): osv-watch badge update"               --body "Publish OSV badge updates through a protected-main PR.

          This automation branch exists because main is protected. Merge only through the normal PR checks."
          else
            echo "Open automation PR already exists for $GENERATED_BRANCH."
          fi
      - name: Upload OSV report
        uses: actions/upload-artifact@v4
        with:
          name: osv-report
          path: osv-report.json

      - name: Summary
        run: |
          echo "### OSV Watch Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f osv-report.json ]; then python3 tools/osv_watch_summary.py >> "$GITHUB_STEP_SUMMARY"; fi
