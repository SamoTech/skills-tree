name: Build Dependency Graph

# Rebuilds the full skill dependency graph after merges to main.
# Outputs: docs/graph/skills-graph.json
#
# Security: gitleaks is pinned to an immutable SHA to prevent
# supply-chain attacks via tag force-push.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/*.md'
      - 'docs/sbom/**'
  workflow_dispatch:

concurrency:
  group: build-graph-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build skills graph
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install graph builder dependencies
        run: pip install --quiet PyYAML==6.0.2 networkx==3.4.2

      - name: Build graph
        run: |
          python tools/build_graph.py \
            --skills-root skills/ \
            --sbom-root docs/sbom/ \
            --output docs/graph/skills-graph.json

      - name: Commit graph
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/graph/skills-graph.json
          git diff --staged --quiet && echo "No graph changes." && exit 0
          git commit -m "chore(graph): rebuild skills dependency graph [skip ci]"
          git push origin main

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to immutable SHA (v2.3.0) — do not change to a floating tag
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c4  # v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
