name: Build Graph

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_graph.py
      - uses: stefanzweifel/git-auto-commit-action@3f65f6fb5f2acb7d13f4f495facac4ac7b1f3b65
        with:
          commit_message: 'chore(graph): refresh generated graph [skip ci]'
