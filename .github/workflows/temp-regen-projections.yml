name: Temp regen projections (PR #621)

on:
  push:
    branches: [counsel/audit-fixes-2-2026-10-18]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: counsel/audit-fixes-2-2026-10-18
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet PyYAML==6.0.3

      - name: Regenerate skills API projections
        run: python3 tools/export_skills.py

      - name: Regenerate changed agent-skills packages
        run: |
          python3 - <<'PYEOF'\nimport sys\nsys.path.insert(0, 'tools')\nfrom pathlib import Path\nfrom generate_agent_skills import project\nroot = Path('.').resolve()\ntargets = '''01-perception/conversation-history-reading.md 01-perception/social-media-reading.md 02-reasoning/abductive.md 03-memory/working-memory.md 04-action-execution/action-concurrency-limiting.md 05-code/cicd-generation.md 06-communication/voice-and-tone-guide-authoring.md 07-tool-use/a2a-tool.md 08-multimodal/3d-asset-generation.md 08-multimodal/watermark-detection.md 09-agentic-patterns/agent-as-tool.md 09-agentic-patterns/constitutional-ai.md 10-computer-use/accessibility-tree.md 10-computer-use/drag-drop.md 12-data/anomaly-detection.md 13-creative/alt-text-writing.md 15-orchestration/agent-communication.md 15-orchestration/agent-incident-command.md 16-domain-specific/ad-copy.md'''.split()\nfor rel in targets:\n    p = project(root / 'skills' / rel, root)\n    assert p.eligible, (rel, p.blockers)\n    dest = root / 'agent-skills' / p.name / 'SKILL.md'\n    dest.parent.mkdir(parents=True, exist_ok=True)\n    dest.write_text(p.content.rstrip() + '\n', encoding='utf-8')\n    print('wrote', dest)\nPYEOF

      - name: Rebuild graph
        run: python3 tools/build_graph.py

      - name: Rebuild search index
        run: |
          python3 tools/build_search_index.py \
            --skills-root skills/ \
            --output docs/search-index.json \
            --package-output data/search-index.json

      - name: Commit and push regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/ data/ agent-skills/ meta/GRAPH_BUILD_REPORT.md
          git diff --staged --quiet && echo "No generated changes." && exit 0
          git commit -m "chore: regenerate projections from canonical skills corpus (temp automation, PR #621)"
          git push origin HEAD:counsel/audit-fixes-2-2026-10-18