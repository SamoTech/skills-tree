name: Temp regen projections

on:
  push:
    branches: [counsel/audit-fixes-2026-10-16]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: counsel/audit-fixes-2026-10-16
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: Run export
        run: python3 tools/export_skills.py

      - name: Validate JSON-LD
        run: python3 tools/verify_jsonld_export.py

      - name: Run build graph
        run: |
          python3 tools/build_graph.py
          cp data/SKILLS_GRAPH.json docs/api/graph.json

      - name: Run freshness tests
        run: |
          python3 -m pytest tests/test_skills_api_freshness.py tests/test_graph_projection_freshness.py tests/test_jsonld_export.py tests/test_search_index_contract.py -q

      - name: Commit regenerated projections
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/ data/SKILLS_GRAPH.json data/SKILLS_GRAPH_STATS.json
          git diff --staged --quiet && echo "No generated changes." && exit 0
          git commit -m "chore(export): regenerate skills API and graph projections"
          git push
