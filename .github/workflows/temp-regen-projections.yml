name: Temp regen projections

on:
  push:
    branches: [counsel/audit-fixes-2-2026-10-18]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: counsel/audit-fixes-2-2026-10-18
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet PyYAML==6.0.3

      - name: Rebuild search index (both projections)
        run: |
          python tools/build_search_index.py --skills-root skills/ --output docs/search-index.json --package-output data/search-index.json

      - name: Rebuild graph projections (single build)
        run: |
          python tools/build_graph.py
          mkdir -p docs/api
          cp data/SKILLS_GRAPH.json docs/api/graph.json

      - name: Commit regenerated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/search-index.json data/search-index.json data/SKILLS_GRAPH.json docs/api/graph.json data/SKILLS_GRAPH_STATS.json meta/GRAPH_BUILD_REPORT.md
          git diff --staged --quiet && echo "No generated changes." && exit 0
          git commit -m "chore: regenerate search-index and graph projections in a single build"
          git push origin HEAD:counsel/audit-fixes-2-2026-10-18
