name: Sync Badges

# Ensures every skill .md file has a corresponding badge JSON in
# docs/badges/. Creates missing badge files with `unscanned` state.
# Removes orphan badge files for deleted skills.
#
# Runs:
#   - On push to main (skill files changed)
#   - Weekly Sunday 01:00 UTC (full reconciliation)
#   - On workflow_dispatch

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/*.md'
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:

# CRITICAL-2 fix: shared group with all other auto-commit workflows.
concurrency:
  group: auto-commit-main
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    name: Sync badge files to skill inventory
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # CRITICAL-1 fix: inline Python heredoc replaced with external script.
      # CRITICAL-3 fix: script uses docs/badges/ as canonical badge directory.
      - name: Reconcile badge files
        run: python3 tools/sync_badges.py

      - name: Commit badge sync
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/badges/
          git diff --staged --quiet && echo "Badges already in sync." && exit 0
          git commit -m "chore(badges): sync badge files to skill inventory [skip ci]"

          for attempt in 1 2 3; do
            git push origin main && {
              echo "Badge sync pushed (attempt ${attempt})."
              exit 0
            }
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "ERROR: Push failed after 3 attempts."
          exit 1

      - name: Summary
        run: |
          BADGE_COUNT=$(ls docs/badges/*.json 2>/dev/null | wc -l || echo 0)
          echo "### 🏷️ Badge Sync" >> $GITHUB_STEP_SUMMARY
          echo "Total badge files: ${BADGE_COUNT}" >> $GITHUB_STEP_SUMMARY
