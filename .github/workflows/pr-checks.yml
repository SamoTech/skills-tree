# ============================================================
# pr-checks.yml
# Runs on every PR targeting main:
#   1. Posts a PR summary comment (changed skill files + docs files)
#   2. Lints HTML in docs/ (no relative asset paths)
#
# NOTE: Skill file structural validation (H1, frontmatter, sections,
# schema) is fully handled by validate-skills.yml and schema-enforce.yml.
# The old duplicate validator that lived here has been removed to prevent
# rule drift between the two workflows. This file now owns only:
#   - HTML lint (docs/index.html relative-path guard)
#   - PR summary comment
# ============================================================
name: ✅ PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  html-lint:
    name: Lint docs HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed.txt
          cat changed.txt

      - name: Check docs HTML
        run: |
          if grep -q 'docs/' changed.txt; then
            echo "Docs changed, running HTML checks..."
            # Reject any relative asset reference (both single and double quotes)
            if grep -E "src=[\"'](\./|\.\./)|href=[\"'](\./|\.\./assets/)" docs/index.html; then
              echo "❌  Relative asset paths found in index.html — use raw.githubusercontent.com URLs instead"
              exit 1
            fi
            echo "✅ No relative asset paths found"
          else
            echo "No docs changes, skipping HTML check"
          fi

  summary:
    name: Post PR summary
    runs-on: ubuntu-latest
    if: always()
    needs: [html-lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        run: git diff --name-only origin/${{ github.base_ref }}...HEAD > changed.txt

      - name: Post PR summary comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let changed = '';
            try { changed = fs.readFileSync('changed.txt', 'utf8'); } catch(e) { changed = ''; }
            const skillFiles = changed.split('\n').filter(f => f.startsWith('skills/') && f.endsWith('.md'));
            const docsFiles  = changed.split('\n').filter(f => f.startsWith('docs/'));
            const body = [
              '## 🤖 PR Check Summary',
              '',
              '| Check | Files |',
              '|---|---|',
              `| 📁 Skill files changed | ${skillFiles.length} |`,
              `| 🌐 Docs files changed | ${docsFiles.length} |`,
              '',
              skillFiles.length > 0
                ? '### Changed skills\n' + skillFiles.map(f => `- \`${f}\``).join('\n')
                : '',
              '',
              '> ℹ️ Structural skill validation runs in **validate-skills** and **schema-enforce** workflows.',
              '',
              '*Auto-generated by PR Checks workflow*'
            ].join('\n');
            // Update existing bot comment if present, else create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.startsWith('## 🤖 PR Check Summary')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
