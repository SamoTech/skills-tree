name: Release → PyPI (manual recovery only)

# This workflow is DISABLED for automatic runs.
# It is kept for manual recovery (workflow_dispatch) only.
# The active release pipeline is zero-touch-release.yml.
#
# Use this to re-publish a tag that was created before zero-touch-release.yml
# was in place (e.g. v1.1.0, v1.1.1).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to republish to PyPI (e.g. v1.1.0)'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: "Build & verify"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag:     ${{ steps.version.outputs.tag }}

    steps:
      - name: Resolve tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG  →  version: $VERSION"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine --quiet

      - name: Build sdist + wheel
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-pypi:
    name: "Publish → PyPI"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/skills-tree/${{ needs.build.outputs.version }}/

    steps:
      - name: Download dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
