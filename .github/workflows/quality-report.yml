name: Skill Quality Report

on:
  pull_request:
    paths:
      - 'skills/**/*.md'
      - 'tools/check_skill_quality.py'
      - 'tools/check_antislop.py'
  push:
    branches: [main]
    paths:
      - 'skills/**/*.md'
      - 'tools/check_skill_quality.py'
      - 'tools/check_antislop.py'
  # API-driven merges in this repository can complete without a usable
  # post-merge push-triggered quality run. Regenerate from trusted main after
  # every merged PR while checking out only the default branch.
  pull_request_target:
    types: [closed]
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'   # Monday 04:00 UTC
  workflow_dispatch:

# Serialize this generated-main writer with the other workflows that commit to main.
concurrency:
  group: auto-commit-main
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enforce:
    name: Block new stubs in PRs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject newly-added stub skills
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Diff against the PR base, not origin/main, so we only look at
          # files this PR actually added.
          git fetch origin "$BASE_REF" --depth=1
          python3 tools/check_skill_quality.py \
            --no-write \
            --enforce-new-stubs \
            --base "origin/$BASE_REF"
      - name: Reject anti-slop errors in changed skills
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 tools/check_antislop.py --changed-only --base "origin/$BASE_REF"


  publish:
    name: Regenerate QUALITY-REPORT.md
    if: github.event_name != 'pull_request' && (github.event_name != 'pull_request_target' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run quality auditor
        run: python3 tools/check_skill_quality.py
      - name: Publish generated changes through protected-main PR
        env:
          GENERATED_BRANCH: automation/generated-quality-report
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/QUALITY-REPORT.md
          git diff --staged --quiet && echo "No generated changes." && exit 0
          git commit -m "chore(quality): regenerate QUALITY-REPORT.md [skip ci]"
          git push --force origin HEAD:"$GENERATED_BRANCH"

          if gh pr list --base main --head "$GENERATED_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create               --base main               --head "$GENERATED_BRANCH"               --title "chore(quality): regenerate QUALITY-REPORT.md"               --body "Publish the generated quality report through a protected-main PR.

          This automation branch exists because main is protected. Merge only through the normal PR checks."
          else
            echo "Open automation PR already exists for $GENERATED_BRANCH."
          fi