name: Stale Skills Audit

# Flags skills with stability: experimental that haven't had their
# last_updated field updated in 6+ months.
# Opens a single GitHub issue (or updates an existing one) with the list.
# Runs monthly so the backlog stays visible without spamming.

on:
  schedule:
    - cron: '0 8 1 * *'   # 1st of every month at 08:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print results without opening/updating the issue'
        type: boolean
        default: false

jobs:
  audit:
    name: Find stale experimental skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyYAML==6.0.2 python-dateutil==2.9.0

      - name: Scan for stale experimental skills
        id: scan
        run: |
          python3 - <<'PYEOF'
          import yaml, json, os
          from pathlib import Path
          from datetime import datetime, timezone
          from dateutil.relativedelta import relativedelta

          STALE_MONTHS = 6
          now = datetime.now(timezone.utc)
          cutoff = now - relativedelta(months=STALE_MONTHS)

          stale = []
          ok = 0

          for f in sorted(Path("skills").rglob("*.md")):
              if "README" in f.name:
                  continue
              text = f.read_text(encoding="utf-8", errors="ignore")
              if not text.startswith("---"):
                  continue
              parts = text.split("---", 2)
              if len(parts) < 3:
                  continue
              try:
                  fm = yaml.safe_load(parts[1])
              except Exception:
                  continue
              if not isinstance(fm, dict):
                  continue
              if fm.get("stability") != "experimental":
                  ok += 1
                  continue

              # Use last_updated if present, else added, else treat as stale
              date_str = fm.get("last_updated") or fm.get("added", "")
              if not date_str:
                  stale.append({"path": str(f), "title": fm.get("title", f.stem), "reason": "no date field"})
                  continue

              try:
                  skill_date = datetime.strptime(str(date_str), "%Y-%m").replace(tzinfo=timezone.utc)
              except ValueError:
                  stale.append({"path": str(f), "title": fm.get("title", f.stem), "reason": f"unparseable date: {date_str}"})
                  continue

              if skill_date < cutoff:
                  age_months = (now.year - skill_date.year) * 12 + (now.month - skill_date.month)
                  stale.append({
                      "path": str(f),
                      "title": fm.get("title", f.stem),
                      "last_updated": str(date_str),
                      "age_months": age_months,
                  })
              else:
                  ok += 1

          print(f"Stale experimental skills: {len(stale)}")
          print(f"Healthy skills checked: {ok}")
          for s in stale:
              print(f"  STALE ({s.get('age_months', '?')}mo): {s['path']}")

          Path("stale-results.json").write_text(json.dumps(stale, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"count={len(stale)}\n")
          PYEOF

      - name: Skip if nothing stale
        if: steps.scan.outputs.count == '0'
        run: echo "No stale experimental skills found."

      - name: Open or update stale-skills issue
        if: steps.scan.outputs.count != '0' && inputs.dry_run != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const stale = JSON.parse(fs.readFileSync('stale-results.json', 'utf8'));
            const LABEL = 'stale-skill';
            const TITLE = '\u{1F9F9} Stale Experimental Skills Audit';

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: LABEL
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: LABEL, color: 'e4e669',
                description: 'Experimental skill not updated in 6+ months'
              });
            }

            const today = new Date().toISOString().slice(0, 10);
            let body = `## \u{1F9F9} Stale Experimental Skills — ${today}\n\n`;
            body += `> Auto-generated by the monthly stale-skills audit.\n`;
            body += `> These skills have \`stability: experimental\` and haven't been updated in **6+ months**.\n\n`;
            body += `| Skill | Path | Last Updated | Age |\n`;
            body += `|-------|------|-------------|-----|\n`;
            for (const s of stale) {
              const age = s.age_months ? `${s.age_months} months` : s.reason || 'unknown';
              body += `| ${s.title} | \`${s.path}\` | ${s.last_updated || '—'} | ${age} |\n`;
            }
            body += `\n### Resolution\n\n`;
            body += `For each skill:\n`;
            body += `1. Review if the skill is still relevant\n`;
            body += `2. Update content and bump \`last_updated\` to the current month\n`;
            body += `3. Promote to \`stability: stable\` if it's ready, or close as \`deprecated\` if not\n`;

            // Find existing open issue with this title
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: LABEL, per_page: 20
            });
            const found = existing.data.find(i => i.title === TITLE);

            if (found) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number, body
              });
              console.log(`Updated existing issue #${found.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: [LABEL]
              });
              console.log(`Created issue #${created.data.number}`);
            }
