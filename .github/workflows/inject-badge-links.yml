name: Inject Badge Links

on:
  workflow_run:
    workflows: ["AST Import Extraction + PyPI Validation"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print changes without writing files"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# SECURITY NOTE:
# This workflow is intentionally safe because it only runs on main,
# only checks workflow_run conclusion, and does NOT download artifacts
# or execute untrusted data from the triggering workflow. Do not add
# artifact downloads or interpolate workflow_run payload fields into shell.
concurrency:
  group: inject-badge-links-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inject:
    name: Inject Badge Links into Skill Files
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
