# ============================================================
# leaderboard.yml
# Rebuilds docs/leaderboard.md every Monday at 07:00 UTC.
# Counts merged PRs that touched skills/**/*.md per contributor.
#
# FIXES applied (2026-05):
#   - Removed unused `requests` pip install (PyGithub bundles it)
#   - sort='created' used consistently so the cutoff break condition
#     is safe (created_at is monotonically increasing; updated_at is not)
#   - git push uses same retry-rebase loop as every other write workflow
#   - Python logic extracted to .github/scripts/ so Dependabot can parse
#     this file (heredoc <<'EOF' syntax breaks Dependabot's YAML scanner)
# ============================================================
name: "\U0001f3c6 Leaderboard"

on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-commit-main
  queue: max
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild leaderboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyGithub==2.4.0 python-dateutil==2.9.0

      - name: Build leaderboard data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/leaderboard_build.py

      - name: Render leaderboard markdown
        run: python3 .github/scripts/leaderboard_render.py

      - name: Publish generated changes through protected-main PR
        env:
          GENERATED_BRANCH: automation/generated-leaderboard
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/leaderboard.md
          git diff --staged --quiet && echo "No generated changes." && exit 0
          git commit -m "chore(leaderboard): rebuild $(date -u '+%Y-%m-%d') [skip ci]"
          git push --force origin HEAD:"$GENERATED_BRANCH"

          if gh pr list --base main --head "$GENERATED_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create               --base main               --head "$GENERATED_BRANCH"               --title "chore(leaderboard): rebuild leaderboard"               --body "Rebuild the leaderboard projection and publish it through a protected-main PR.

          This automation branch exists because main is protected. Merge only through the normal PR checks."
          else
            echo "Open automation PR already exists for $GENERATED_BRANCH."
          fi
