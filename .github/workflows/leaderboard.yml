# ============================================================
# leaderboard.yml
# Rebuilds docs/leaderboard.md every Monday at 07:00 UTC.
# Counts merged PRs that touched skills/**/*.md per contributor.
#
# FIXES applied (2026-05):
#   - Removed unused `requests` pip install (PyGithub bundles it)
#   - sort='created' used consistently so the cutoff break condition
#     is safe (created_at is monotonically increasing; updated_at is not)
#   - git push uses same retry-rebase loop as every other write workflow
# ============================================================
name: 🏆 Leaderboard

on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild leaderboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyGithub==2.4.0 python-dateutil==2.9.0

      - name: Build leaderboard data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os, json
          from datetime import datetime, timezone, timedelta
          from github import Github

          g    = Github(os.environ["GH_TOKEN"])
          repo = g.get_repo("${{ github.repository }}")

          now           = datetime.now(timezone.utc)
          cutoff_30d    = now - timedelta(days=30)
          cutoff_90d    = now - timedelta(days=90)
          cutoff_alltime = now - timedelta(days=365)

          scores_30d    = {}
          scores_90d    = {}
          scores_alltime = {}

          # sort='created' is REQUIRED here — the break on cutoff_alltime
          # is only safe when PRs are returned in descending creation order.
          # sort='updated' would break early when a recently-commented-on
          # old PR appears at the top of the list.
          for pr in repo.get_pulls(
              state="closed",
              sort="created",
              direction="desc",
              base="main"
          ):
              if pr.merged_at is None:
                  continue
              if pr.created_at < cutoff_alltime:
                  break

              files = [f.filename for f in pr.get_files()]
              if not any(f.startswith("skills/") and f.endswith(".md") for f in files):
                  continue

              user = pr.user.login
              scores_alltime[user] = scores_alltime.get(user, 0) + 1
              if pr.created_at >= cutoff_90d:
                  scores_90d[user] = scores_90d.get(user, 0) + 1
              if pr.created_at >= cutoff_30d:
                  scores_30d[user] = scores_30d.get(user, 0) + 1

          data = {
              "generated_at": now.isoformat(),
              "leaderboard_30d":    sorted(scores_30d.items(),    key=lambda x: -x[1]),
              "leaderboard_90d":    sorted(scores_90d.items(),    key=lambda x: -x[1]),
              "leaderboard_alltime": sorted(scores_alltime.items(), key=lambda x: -x[1]),
          }
          with open("leaderboard_data.json", "w") as f:
              json.dump(data, f, indent=2)
          print(f"Top contributors (all-time): {data['leaderboard_alltime'][:5]}")
          EOF

      - name: Render leaderboard markdown
        run: |
          python3 - <<'EOF'
          import json
          from datetime import datetime

          with open("leaderboard_data.json") as f:
              data = json.load(f)

          def render_table(entries, limit=20):
              if not entries:
                  return "_No contributions yet._\n"
              rows = ["| Rank | Contributor | Merged PRs |",
                      "|------|-------------|------------|"
              ]
              for i, (user, count) in enumerate(entries[:limit], 1):
                  medal = ["🥇", "🥈", "🥉"].get(i - 1, str(i))
                  rows.append(f"| {medal} | [@{user}](https://github.com/{user}) | {count} |")
              return "\n".join(rows) + "\n"

          ts  = data["generated_at"][:10]
          out = f"""# 🏆 Contributors Leaderboard

> Last updated: {ts}  
> Counts merged PRs that added or improved a skill file.

## Last 30 days
{render_table(data['leaderboard_30d'])}
## Last 90 days
{render_table(data['leaderboard_90d'])}
## All time (past 12 months)
{render_table(data['leaderboard_alltime'])}
"""
          with open("docs/leaderboard.md", "w") as f:
              f.write(out)
          print("Leaderboard written to docs/leaderboard.md")
          EOF

      - name: Commit leaderboard to main (with retry-rebase)
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/leaderboard.md
          git diff --staged --quiet && echo "Leaderboard unchanged." && exit 0

          git commit -m "chore(leaderboard): rebuild $(date -u '+%Y-%m-%d') [skip ci]"

          for attempt in 1 2 3; do
            git push origin main && {
              echo "Leaderboard pushed (attempt ${attempt})."
              exit 0
            }
            echo "Push failed (attempt ${attempt}/3). Rebasing..."
            git fetch origin main
            git rebase origin/main
            git checkout --theirs docs/leaderboard.md 2>/dev/null || true
            git add docs/leaderboard.md || true
            git rebase --continue --no-edit || true
            sleep $((attempt * 2))
          done

          echo "ERROR: All 3 push attempts failed."
          exit 1
