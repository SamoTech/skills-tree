# ============================================================
# leaderboard.yml
# Rebuilds docs/leaderboard.md every Monday at 07:00 UTC.
# Counts merged PRs that touched skills/**/*.md per contributor.
#
# FIXES applied (2026-05):
#   - Removed unused `requests` pip install (PyGithub bundles it)
#   - sort='created' used consistently so the cutoff break condition
#     is safe (created_at is monotonically increasing; updated_at is not)
#   - git push uses same retry-rebase loop as every other write workflow
#   - Python logic extracted to .github/scripts/ so Dependabot can parse
#     this file (heredoc <<'EOF' syntax breaks Dependabot's YAML scanner)
# ============================================================
name: "\U0001f3c6 Leaderboard"

on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild leaderboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyGithub==2.4.0 python-dateutil==2.9.0

      - name: Build leaderboard data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/leaderboard_build.py

      - name: Render leaderboard markdown
        run: python3 .github/scripts/leaderboard_render.py

      - name: Commit leaderboard to main (with retry-rebase)
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/leaderboard.md
          git diff --staged --quiet && echo "Leaderboard unchanged." && exit 0

          git commit -m "chore(leaderboard): rebuild $(date -u '+%Y-%m-%d') [skip ci]"

          for attempt in 1 2 3; do
            git push origin main && {
              echo "Leaderboard pushed (attempt ${attempt})."
              exit 0
            }
            echo "Push failed (attempt ${attempt}/3). Rebasing..."
            git fetch origin main
            git rebase origin/main
            git checkout --theirs docs/leaderboard.md 2>/dev/null || true
            git add docs/leaderboard.md || true
            git rebase --continue --no-edit || true
            sleep $((attempt * 2))
          done

          echo "ERROR: All 3 push attempts failed."
          exit 1
