name: Export Skills API

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/*.md'
      - 'tools/export_skills.py'
      - 'registry/universal_registry.json'
  schedule:
    - cron: '30 4 * * 1'  # Monday 04:30 UTC (after version-stats)
  workflow_dispatch:

permissions:
  contents: write


# Serialize runs of THIS workflow on the same ref so concurrent
# scheduled triggers do not race when pushing back to main.
# Distinct workflow classes (graph, exports, badges, …) intentionally
# use different groups so they can still run in parallel.
concurrency:
  group: auto-commit-main
  queue: max
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run export
        run: python3 tools/export_skills.py

      - name: Validate generated JSON-LD projection
        run: python3 tools/verify_jsonld_export.py

      - name: Publish generated changes through protected-main PR
        env:
          GENERATED_BRANCH: automation/generated-skill-api
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/
          git diff --staged --quiet && echo "No generated changes." && exit 0
          git commit -m "chore(export): regenerate skills API [skip ci]"
          git push --force origin HEAD:"$GENERATED_BRANCH"

          if gh pr list --base main --head "$GENERATED_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create               --base main               --head "$GENERATED_BRANCH"               --title "chore(export): regenerate skills API"               --body "Regenerate the Skills API/JSON-LD projections and publish them through a protected-main PR.

          This automation branch exists because main is protected. Merge only through the normal PR checks."
          else
            echo "Open automation PR already exists for $GENERATED_BRANCH."
          fi
