name: Real Skill Activation Evidence

# Decomposed 2026-10-12: step logic lives in tools/activation/*.py (extracted
# verbatim from this file's inline heredocs); this workflow orchestrates the
# scripts. Contracts, acceptance gates, and permissions are unchanged.

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/activation/**'
      - 'meta/skill-activation-observation.schema.json'
      - 'tools/run_skill_activation_benchmark.py'
      - 'tools/activation/**'
      - '.github/workflows/skill-activation-runtime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/activation/**'
      - 'meta/skill-activation-observation.schema.json'
      - 'tools/run_skill_activation_benchmark.py'
      - 'tools/activation/**'
      - '.github/workflows/skill-activation-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-evidence:
    name: Collect 12 Real Skill Activation Observations
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preflight runner accelerator availability
        id: accelerator_preflight
        run: |
          set -u
          report="$RUNNER_TEMP/activation-runtime-preflight.txt"
          mkdir -p "$RUNNER_TEMP"
          {
            echo "STATUS=CHECKING_ACCELERATOR"
            echo "RUNNER_OS=${RUNNER_OS:-unknown}"
            echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
            echo "ImageOS=${ImageOS:-unknown}"
            echo "ImageVersion=${ImageVersion:-unknown}"
            echo "Kernel: $(uname -a)"
            echo "GPU probe output:"
          } > "$report"

          accelerator_found=0
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia_output="$RUNNER_TEMP/nvidia-smi-preflight.txt"
            if nvidia-smi -L > "$nvidia_output" 2>&1; then
              cat "$nvidia_output" >> "$report"
              if grep -Eq '^GPU [0-9]+:' "$nvidia_output"; then
                accelerator_found=1
              fi
            else
              cat "$nvidia_output" >> "$report"
            fi
          else
            echo "nvidia-smi: unavailable" >> "$report"
          fi
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm_output="$RUNNER_TEMP/rocm-smi-preflight.txt"
            if rocm-smi --showproductname > "$rocm_output" 2>&1; then
              cat "$rocm_output" >> "$report"
              if grep -Eq 'GPU\[[0-9]+\]' "$rocm_output"; then
                accelerator_found=1
              fi
            else
              cat "$rocm_output" >> "$report"
            fi
          else
            echo "rocm-smi: unavailable" >> "$report"
          fi
          if command -v rocminfo >/dev/null 2>&1; then
            rocminfo_output="$RUNNER_TEMP/rocminfo-preflight.txt"
            if rocminfo > "$rocminfo_output" 2>&1; then
              cat "$rocminfo_output" >> "$report"
              if grep -Eiq 'Device Type:[[:space:]]*GPU' "$rocminfo_output"; then
                accelerator_found=1
              fi
            else
              cat "$rocminfo_output" >> "$report"
            fi
          else
            echo "rocminfo: unavailable" >> "$report"
          fi

          if [ "$accelerator_found" -ne 1 ]; then
            {
              echo "STATUS=INFRASTRUCTURE_INELIGIBLE"
              echo "REASON=No supported NVIDIA/AMD accelerator was detected before dependency installation or model download."
            } >> "$report"
            {
              echo "## Activation benchmark runtime eligibility"
              echo "- Status: **INFRASTRUCTURE_INELIGIBLE**"
              echo "- Reason: no supported NVIDIA/AMD accelerator was detected on this runner."
              echo "- The Hermes routing qualification and all 12 observations were not started."
              echo "- This is an infrastructure eligibility result, not a skill-routing failure."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            cat "$report"
            exit 0
          fi

          echo "STATUS=ACCELERATOR_DETECTED; model allocation still requires verification after warmup." >> "$report"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          cat "$report"

      - name: Install Hermes Agent
        if: steps.accelerator_preflight.outputs.eligible == 'true'
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          set -euo pipefail
          export UV_NO_CONFIG=1
          export HERMES_RUNTIME_HOME="$HERMES_HOME"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          # Pin the exact upstream runtime commit so benchmark runs are reproducible.
          HERMES_COMMIT="a62979dc3601c9eae455bff5b35ba8f9bed0df30"
          git init "$HERMES_HOME/hermes-agent"
          git -C "$HERMES_HOME/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$HERMES_HOME/hermes-agent" fetch --depth 1 origin "$HERMES_COMMIT"
          git -C "$HERMES_HOME/hermes-agent" checkout --detach FETCH_HEAD
          test "$(git -C "$HERMES_HOME/hermes-agent" rev-parse HEAD)" = "$HERMES_COMMIT"
          echo "Pinned Hermes runtime commit: $HERMES_COMMIT"
          uv venv "$HERMES_HOME/venv" --python 3.14
          uv pip install --python "$HERMES_HOME/venv/bin/python" -e "$HERMES_HOME/hermes-agent[all]" httpx ruamel.yaml python-dotenv rich
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/hermes" <<'EOF'
          #!/usr/bin/env bash
          export HERMES_DISABLE_LAZY_INSTALLS=1
          exec "${HERMES_RUNTIME_HOME:?HERMES_RUNTIME_HOME must be set}/venv/bin/python" -m hermes_cli.main "$@"
          EOF
          echo "HERMES_RUNTIME_HOME=$HERMES_HOME" >> "$GITHUB_ENV"
          chmod +x "$HOME/.local/bin/hermes"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "HERMES_DISABLE_LAZY_INSTALLS=1" >> "$GITHUB_ENV"
          "$HOME/.local/bin/hermes" --version

      - name: Install local Ollama runtime
        if: steps.accelerator_preflight.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh

          # The installer starts a systemd service. Shell exports alone do not
          # change that service's environment, so stop it and launch Ollama
          # with the 64K runtime context required by Hermes tool use.
          sudo systemctl stop ollama || true
          export OLLAMA_CONTEXT_LENGTH=65536
          export OLLAMA_NUM_PARALLEL=1
          echo "OLLAMA_CONTEXT_LENGTH=$OLLAMA_CONTEXT_LENGTH" >> "$GITHUB_ENV"
          echo "OLLAMA_NUM_PARALLEL=$OLLAMA_NUM_PARALLEL" >> "$GITHUB_ENV"
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          OLLAMA_PID=$!
          echo "$OLLAMA_PID" > "$RUNNER_TEMP/ollama.pid"

          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$OLLAMA_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/ollama.log"
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/ollama.log"
            echo "Ollama API did not become ready within 120 seconds." >&2
            exit 1
          fi

          MODEL="qwen3.5:4b"

          # Ollama's registry can return transient 5xx responses while resolving
          # manifests or finalizing a large layer. Retry the same pull so Ollama
          # can reuse completed blobs; never continue without a verified model.
          pull_succeeded=0
          for attempt in 1 2 3 4; do
            pull_log="$RUNNER_TEMP/ollama-pull-attempt-$attempt.log"
            echo "Pulling $MODEL (attempt $attempt/4)..."
            if ollama pull "$MODEL" >"$pull_log" 2>&1; then
              pull_succeeded=1
              echo "PASS: ollama pull succeeded on attempt $attempt."
              tail -n 20 "$pull_log"
              break
            else
              pull_rc=$?
              echo "WARN: ollama pull attempt $attempt failed (exit=$pull_rc)." >&2
              tail -n 40 "$pull_log" >&2 || true
              if [ "$attempt" -lt 4 ]; then
                delay=$((attempt * 15))
                echo "Retrying the same model pull in $delay seconds; completed Ollama blobs are retained."
                sleep "$delay"
              fi
            fi
          done

          if [ "$pull_succeeded" -ne 1 ]; then
            echo "FAIL: unable to pull $MODEL after four attempts." >&2
            echo "Ollama server log:" >&2
            tail -n 100 "$RUNNER_TEMP/ollama.log" >&2 || true
            exit 1
          fi

          # Confirm the exact requested model is present before exposing it to
          # later steps. A successful command without a listed model is invalid.
          ollama list | tee "$RUNNER_TEMP/ollama-model-list.txt"
          grep -Eq "^qwen3[.]5:4b[[:space:]]" "$RUNNER_TEMP/ollama-model-list.txt" || {
            echo "FAIL: $MODEL is not present after a successful pull." >&2
            exit 1
          }
          echo "HERMES_LOCAL_MODEL=$MODEL" >> "$GITHUB_ENV"
          grep -E 'OLLAMA_CONTEXT_LENGTH=65536|OLLAMA_NUM_PARALLEL=1' "$RUNNER_TEMP/ollama.log" || true

      - name: Install activation observer plugin
        if: steps.accelerator_preflight.outputs.eligible == 'true'
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME/plugins/skills-tree-activation-observer"
          cp benchmarks/activation/hermes_skill_activation_observer.py "$HERMES_HOME/plugins/skills-tree-activation-observer/__init__.py"
          cat > "$HERMES_HOME/plugins/skills-tree-activation-observer/plugin.yaml" <<'YAML'
          name: skills-tree-activation-observer
          kind: standalone
          version: 1.0.0
          description: Capture explicit Skills Tree activation lifecycle evidence for benchmark runs.
          provides_hooks:
            - post_tool_call
            - on_skill_lifecycle
          YAML
          HERMES_HOME="$HERMES_HOME" hermes plugins enable skills-tree-activation-observer
          HERMES_HOME="$HERMES_HOME" hermes plugins doctor "$HERMES_HOME/plugins/skills-tree-activation-observer" --ci

      - name: Install the three benchmark Skills into Hermes
        if: steps.accelerator_preflight.outputs.eligible == 'true'
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          python tools/activation/install_benchmark_skills.py

      - name: Restrict skill catalog to benchmark skills
        if: steps.accelerator_preflight.outputs.eligible == 'true'
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          HERMES_RUNTIME_HOME: ${{ runner.temp }}/hermes-home
        run: |
          set -euo pipefail
          # Hermes bundles many unrelated skills; hide them so the small local
          # model routes among this benchmark's three canonical skills rather
          # than hallucinating unrelated skill names. Preserve Hermes essentials.
          "$HERMES_HOME/venv/bin/python" tools/activation/restrict_skill_catalog.py
          HERMES_HOME="$HERMES_HOME" hermes skills list | tee "$RUNNER_TEMP/hermes-skills.txt"
          grep -q 'skills-tree-rag' "$RUNNER_TEMP/hermes-skills.txt"
          grep -q 'skills-tree-code-review' "$RUNNER_TEMP/hermes-skills.txt"
          grep -q 'skills-tree-web-search' "$RUNNER_TEMP/hermes-skills.txt"
          "$HERMES_HOME/venv/bin/python" tools/activation/verify_skill_view_allowlist.py

      - name: Configure Hermes for local Ollama
        if: steps.accelerator_preflight.outputs.eligible == 'true'
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          HERMES_HOME="$HERMES_HOME" hermes config set model "custom/$HERMES_LOCAL_MODEL"
          HERMES_HOME="$HERMES_HOME" hermes config set model.base_url "http://127.0.0.1:11434/v1"
          HERMES_HOME="$HERMES_HOME" hermes config set model.provider "custom"
          HERMES_HOME="$HERMES_HOME" hermes config set model.default "$HERMES_LOCAL_MODEL"
          # Hermes requires at least 64K of actual runtime context when tools are enabled.
          # Keep the declared and Ollama runtime windows aligned at 64K; verify
          # the loaded context via `ollama ps` before allowing the benchmark to run.
          HERMES_HOME="$HERMES_HOME" hermes config set model.context_length 65536
          HERMES_HOME="$HERMES_HOME" hermes config set model.ollama_num_ctx 65536
          HERMES_HOME="$HERMES_HOME" hermes config get model.ollama_num_ctx
          HERMES_HOME="$HERMES_HOME" hermes config get model.context_length
          HERMES_HOME="$HERMES_HOME" hermes config get model
          HERMES_HOME="$HERMES_HOME" hermes config get model.base_url

      - name: Verify runtime connectivity
        if: steps.accelerator_preflight.outputs.eligible == 'true'
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          HERMES_HOME="$HERMES_HOME" hermes skills list | tee "$RUNNER_TEMP/hermes-skills.txt"
          grep -q 'skills-tree-rag' "$RUNNER_TEMP/hermes-skills.txt"
          grep -q 'skills-tree-code-review' "$RUNNER_TEMP/hermes-skills.txt"
          grep -q 'skills-tree-web-search' "$RUNNER_TEMP/hermes-skills.txt"

      - name: Warm model and verify allocated context before qualification
        if: steps.accelerator_preflight.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          # Force-load the exact model with an explicit 64K context before the
          # slow routing qualification. Fail fast if Ollama cannot allocate it.
          curl -fsS http://127.0.0.1:11434/api/generate \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"$HERMES_LOCAL_MODEL\",\"prompt\":\"Reply with exactly OK.\",\"stream\":false,\"keep_alive\":\"10m\",\"options\":{\"num_ctx\":65536,\"num_predict\":8}}" \
            > "$RUNNER_TEMP/ollama-context-preflight.json"
          python tools/activation/verify_warmup_context.py
          ollama ps | tee "$RUNNER_TEMP/ollama-loaded-models.txt"
          grep -E 'qwen3[.]5:4b.*65536' "$RUNNER_TEMP/ollama-loaded-models.txt" || {
            echo "FAIL: Ollama did not allocate 65536 context for $HERMES_LOCAL_MODEL before qualification." >&2
            exit 1
          }

      - name: Verify Ollama actually allocated GPU for the benchmark model
        id: runtime_accelerator_preflight
        if: steps.accelerator_preflight.outputs.eligible == 'true'
        run: |
          set -u
          report="$RUNNER_TEMP/activation-runtime-preflight.txt"
          ps_file="$RUNNER_TEMP/ollama-loaded-models.txt"
          echo "Ollama model allocation:" >> "$report"
          cat "$ps_file" >> "$report"
          if [ ! -s "$ps_file" ]; then
            {
              echo "STATUS=RUNTIME_PREFLIGHT_FAILED"
              echo "REASON=ollama ps returned no model allocation details."
            } >> "$report"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "- Runtime preflight: **RUNTIME_PREFLIGHT_FAILED** — Ollama did not report a loaded model." >> "$GITHUB_STEP_SUMMARY"
            cat "$report"
            exit 0
          fi

          python tools/activation/verify_gpu_allocation.py

      - name: Qualify Hermes skill routing before the full benchmark
        if: steps.runtime_accelerator_preflight.outputs.eligible == 'true'
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          set -euo pipefail
          # The smoke gate must prove real tool invocation and correct routing,
          # not merely that the model can produce plain text. One fresh session
          # per benchmark case catches a bad model/runtime before spending time
          # on all 12 measured observations.
          python tools/activation/qualify_skill_routing.py

      - name: Run 12 independent fresh-session observations
        if: steps.runtime_accelerator_preflight.outputs.eligible == 'true'
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          HERMES_STREAM_READ_TIMEOUT: '1800'
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/activation-traces"

          python tools/activation/run_activation_observations.py
      - name: Convert explicit runtime traces to benchmark observations
        if: steps.runtime_accelerator_preflight.outputs.eligible == 'true'
        run: |
          python tools/activation/convert_activation_traces.py

      - name: Validate observation corpus against schema
        if: steps.runtime_accelerator_preflight.outputs.eligible == 'true'
        run: |
          python tools/activation/validate_observations.py

      - name: Run activation benchmark
        if: steps.runtime_accelerator_preflight.outputs.eligible == 'true'
        id: benchmark
        run: |
          python tools/run_skill_activation_benchmark.py --observations "$RUNNER_TEMP/skill-activation-observations.json" --output "$RUNNER_TEMP/skill-activation-benchmark-result.json"

      - name: Write evidence summary
        if: always()
        run: |
          echo "## Real skill activation evidence" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/activation-runtime-preflight.txt" ]; then
            echo "### Runtime preflight evidence" >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/activation-runtime-preflight.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/skill-activation-benchmark-result.json" ]; then
            python tools/activation/render_benchmark_summary.py >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Benchmark result was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-activation-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/activation-traces/*.jsonl
            ${{ runner.temp }}/activation-traces/*.log
            ${{ runner.temp }}/skill-activation-observations.json
            ${{ runner.temp }}/skill-activation-benchmark-result.json
            ${{ runner.temp }}/hermes-skills.txt
            ${{ runner.temp }}/activation-qualification/*.jsonl
            ${{ runner.temp }}/activation-qualification/*.log
            ${{ runner.temp }}/ollama-loaded-models.txt
            ${{ runner.temp }}/ollama-model-list.txt
            ${{ runner.temp }}/ollama-pull-attempt-*.log
            ${{ runner.temp }}/ollama.log
            ${{ runner.temp }}/activation-runtime-preflight.txt
          if-no-files-found: warn

      - name: Enforce benchmark acceptance contract
        if: always()
        run: |
          python tools/activation/enforce_acceptance_contract.py
