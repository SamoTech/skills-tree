name: Real Skill Activation Evidence

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/activation/**'
      - 'meta/skill-activation-observation.schema.json'
      - 'tools/run_skill_activation_benchmark.py'
      - '.github/workflows/skill-activation-runtime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/activation/**'
      - 'meta/skill-activation-observation.schema.json'
      - 'tools/run_skill_activation_benchmark.py'
      - '.github/workflows/skill-activation-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-evidence:
    name: Collect 12 Real Skill Activation Observations
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Hermes Agent
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          set -euo pipefail
          export UV_NO_CONFIG=1
          export HERMES_RUNTIME_HOME="$HERMES_HOME"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          # Pin the exact upstream runtime commit so benchmark runs are reproducible.
          HERMES_COMMIT="a62979dc3601c9eae455bff5b35ba8f9bed0df30"
          git init "$HERMES_HOME/hermes-agent"
          git -C "$HERMES_HOME/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$HERMES_HOME/hermes-agent" fetch --depth 1 origin "$HERMES_COMMIT"
          git -C "$HERMES_HOME/hermes-agent" checkout --detach FETCH_HEAD
          test "$(git -C "$HERMES_HOME/hermes-agent" rev-parse HEAD)" = "$HERMES_COMMIT"
          echo "Pinned Hermes runtime commit: $HERMES_COMMIT"
          uv venv "$HERMES_HOME/venv" --python 3.14
          uv pip install --python "$HERMES_HOME/venv/bin/python" -e "$HERMES_HOME/hermes-agent[all]" httpx ruamel.yaml python-dotenv rich
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/hermes" <<'EOF'
          #!/usr/bin/env bash
          export HERMES_DISABLE_LAZY_INSTALLS=1
          exec "${HERMES_RUNTIME_HOME:?HERMES_RUNTIME_HOME must be set}/venv/bin/python" -m hermes_cli.main "$@"
          EOF
          echo "HERMES_RUNTIME_HOME=$HERMES_HOME" >> "$GITHUB_ENV"
          chmod +x "$HOME/.local/bin/hermes"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "HERMES_DISABLE_LAZY_INSTALLS=1" >> "$GITHUB_ENV"
          "$HOME/.local/bin/hermes" --version

      - name: Install local Ollama runtime
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh

          # The installer starts a systemd service. Shell exports alone do not
          # change that service's environment, so stop it and launch Ollama
          # with the context settings this benchmark actually requires.
          sudo systemctl stop ollama || true
          export OLLAMA_CONTEXT_LENGTH=65536
          export OLLAMA_NUM_PARALLEL=1
          echo "OLLAMA_CONTEXT_LENGTH=$OLLAMA_CONTEXT_LENGTH" >> "$GITHUB_ENV"
          echo "OLLAMA_NUM_PARALLEL=$OLLAMA_NUM_PARALLEL" >> "$GITHUB_ENV"
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          OLLAMA_PID=$!
          echo "$OLLAMA_PID" > "$RUNNER_TEMP/ollama.pid"

          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$OLLAMA_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/ollama.log"
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/ollama.log"
            echo "Ollama API did not become ready within 120 seconds." >&2
            exit 1
          fi

          MODEL="qwen2.5:7b"
          ollama pull "$MODEL"
          echo "HERMES_LOCAL_MODEL=$MODEL" >> "$GITHUB_ENV"
          ollama list
          grep -E 'OLLAMA_CONTEXT_LENGTH=65536|OLLAMA_NUM_PARALLEL=1' "$RUNNER_TEMP/ollama.log" || true

      - name: Install activation observer plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME/plugins/skills-tree-activation-observer"
          cp benchmarks/activation/hermes_skill_activation_observer.py "$HERMES_HOME/plugins/skills-tree-activation-observer/__init__.py"
          cat > "$HERMES_HOME/plugins/skills-tree-activation-observer/plugin.yaml" <<'YAML'
          name: skills-tree-activation-observer
          kind: standalone
          version: 1.0.0
          description: Capture explicit Skills Tree activation lifecycle evidence for benchmark runs.
          provides_hooks:
            - post_tool_call
            - on_skill_lifecycle
          YAML
          HERMES_HOME="$HERMES_HOME" hermes plugins enable skills-tree-activation-observer
          HERMES_HOME="$HERMES_HOME" hermes plugins doctor "$HERMES_HOME/plugins/skills-tree-activation-observer" --ci

      - name: Install the three benchmark Skills into Hermes
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          root = Path.cwd()
          home = Path(os.environ["HERMES_HOME"])
          specs = {
              "skills-tree-rag": (
                  "03-memory/rag",
                  "skills/03-memory/rag.md",
                  "Retrieve and ground answers in a private corpus using retrieval-augmented generation. Use for private or known-source retrieval, grounding, and citation.",
              ),
              "skills-tree-code-review": (
                  "05-code/code-review",
                  "skills/05-code/code-review.md",
                  "Review concrete source code or code changes for correctness, security, maintainability, tests, and repository conventions.",
              ),
              "skills-tree-web-search": (
                  "11-web/web-search",
                  "skills/11-web/web-search.md",
                  "Search the open web for current information, ranked sources, freshness, and citations.",
              ),
          }

          for runtime_name, (canonical_id, source_rel, description) in specs.items():
              source = root / source_rel
              text = source.read_text(encoding="utf-8")
              parts = text.split("---", 2)
              body = parts[2].lstrip() if len(parts) == 3 else text
              out = home / "skills" / runtime_name
              out.mkdir(parents=True, exist_ok=True)
              skill = "\n".join([
                  "---",
                  f"name: {runtime_name}",
                  f"description: {description}",
                  "metadata:",
                  f"  skills_tree_canonical_id: {canonical_id}",
                  "---",
                  "",
              ]) + body
              (out / "SKILL.md").write_text(skill, encoding="utf-8")
          PY

      - name: Restrict skill catalog to benchmark skills
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          HERMES_RUNTIME_HOME: ${{ runner.temp }}/hermes-home
        run: |
          set -euo pipefail
          # Hermes bundles many unrelated skills; hide them so the small local
          # model routes among this benchmark's three canonical skills rather
          # than hallucinating unrelated skill names. Preserve Hermes essentials.
          "$HERMES_HOME/venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from agent.skill_utils import ESSENTIAL_SKILLS
          from hermes_cli.config import load_config, save_config
          from tools.skills_tool import _find_all_skills

          allowed = {"skills-tree-rag", "skills-tree-code-review", "skills-tree-web-search"} | set(ESSENTIAL_SKILLS)
          catalog = _find_all_skills(skip_disabled=True)
          disabled = sorted({item["name"] for item in catalog if item["name"] not in allowed})
          config = load_config()
          config.setdefault("skills", {})["disabled"] = disabled
          save_config(config)

          # Enforce the benchmark's closed skill universe at the actual skill_view
          # tool boundary too. Catalog filtering alone is not an authorization check:
          # a model can still request a name that is not listed.
          home = Path(os.environ["HERMES_HOME"])
          runtime_file = home / "hermes-agent" / "tools" / "skills_tool.py"
          source = runtime_file.read_text(encoding="utf-8")
          anchor = "    try:\n        # Validate before the ':' dispatch"
          guard = (
              "    try:\n"
              "        allowed_benchmark_skills = {\n"
              "            \"skills-tree-rag\",\n"
              "            \"skills-tree-code-review\",\n"
              "            \"skills-tree-web-search\",\n"
              "        }\n"
              "        if name not in allowed_benchmark_skills:\n"
              "            return _fail(\n"
              "                f\"Skill '{name}' is outside the activation benchmark allowlist.\"\n"
              "            )\n"
              "        # Validate before the ':' dispatch"
          )
          if anchor not in source:
              raise SystemExit("Could not install activation benchmark skill_view allowlist: upstream source anchor changed.")
          runtime_file.write_text(source.replace(anchor, guard, 1), encoding="utf-8")

          print(f"Disabled {len(disabled)} unrelated skills; retained {sorted(allowed)}")
          print("Installed strict skill_view allowlist for the three benchmark runtime names.")
          PY
          HERMES_HOME="$HERMES_HOME" hermes skills list | tee "$RUNNER_TEMP/hermes-skills.txt"
          grep -q 'skills-tree-rag' "$RUNNER_TEMP/hermes-skills.txt"
          grep -q 'skills-tree-code-review' "$RUNNER_TEMP/hermes-skills.txt"
          grep -q 'skills-tree-web-search' "$RUNNER_TEMP/hermes-skills.txt"
          "$HERMES_HOME/venv/bin/python" - <<'PY'
          from tools.skills_tool import skill_view

          allowed = {
              "skills-tree-rag": "RAG",
              "skills-tree-code-review": "Code Review",
              "skills-tree-web-search": "Web Search",
          }
          for name, expected_heading in allowed.items():
              result = skill_view(name)
              if expected_heading not in result:
                  raise SystemExit(f"Allowed benchmark skill failed direct load: {name}")

          forbidden = skill_view("hermes-agent-skill-authoring")
          if "outside the activation benchmark allowlist" not in forbidden:
              raise SystemExit("Forbidden skill_view request was not blocked.")
          print("PASS: skill_view loads all three allowed skills and rejects an out-of-scope skill.")
          PY

      - name: Configure Hermes for local Ollama
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          HERMES_HOME="$HERMES_HOME" hermes config set model "custom/$HERMES_LOCAL_MODEL"
          HERMES_HOME="$HERMES_HOME" hermes config set model.base_url "http://127.0.0.1:11434/v1"
          HERMES_HOME="$HERMES_HOME" hermes config set model.provider "custom"
          HERMES_HOME="$HERMES_HOME" hermes config set model.default "$HERMES_LOCAL_MODEL"
          # Hermes enforces a 64K minimum. Keep its declared window aligned with Ollama.
          HERMES_HOME="$HERMES_HOME" hermes config set model.context_length 65536
          # Pin Ollama's runtime context for the selected Qwen 3.5 model.
          HERMES_HOME="$HERMES_HOME" hermes config set model.ollama_num_ctx 65536
          HERMES_HOME="$HERMES_HOME" hermes config get model.ollama_num_ctx
          HERMES_HOME="$HERMES_HOME" hermes config get model.context_length
          HERMES_HOME="$HERMES_HOME" hermes config get model
          HERMES_HOME="$HERMES_HOME" hermes config get model.base_url

      - name: Verify runtime connectivity
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          HERMES_HOME="$HERMES_HOME" hermes skills list | tee "$RUNNER_TEMP/hermes-skills.txt"
          grep -q 'skills-tree-rag' "$RUNNER_TEMP/hermes-skills.txt"
          grep -q 'skills-tree-code-review' "$RUNNER_TEMP/hermes-skills.txt"
          grep -q 'skills-tree-web-search' "$RUNNER_TEMP/hermes-skills.txt"

      - name: Qualify Hermes skill routing before the full benchmark
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          set -euo pipefail
          # The smoke gate must prove real tool invocation and correct routing,
          # not merely that the model can produce plain text. One fresh session
          # per benchmark case catches a bad model/runtime before spending time
          # on all 12 measured observations.
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          dataset = json.loads(Path("benchmarks/activation/skill-activation-v1.json").read_text(encoding="utf-8"))
          trace_root = Path(os.environ["RUNNER_TEMP"]) / "activation-qualification"
          trace_root.mkdir(parents=True, exist_ok=True)
          base_home = Path(os.environ["HERMES_HOME"])
          model = os.environ["HERMES_LOCAL_MODEL"]
          expected_runtime_names = {
              "03-memory/rag": "skills-tree-rag",
              "05-code/code-review": "skills-tree-code-review",
              "11-web/web-search": "skills-tree-web-search",
          }

          for case in dataset["cases"]:
              trace_id = f'{case["id"]}-qualification'
              trace_path = trace_root / f"{trace_id}.jsonl"
              trace_path.unlink(missing_ok=True)
              trace_path.touch()
              session_home = trace_root / f"{trace_id}-home"
              shutil.rmtree(session_home, ignore_errors=True)
              session_home.mkdir(parents=True)
              (session_home / "config.yaml").write_bytes((base_home / "config.yaml").read_bytes())
              for dirname in ("plugins", "skills"):
                  (session_home / dirname).symlink_to(base_home / dirname, target_is_directory=True)

              env = os.environ.copy()
              env["SKILLS_TREE_HERMES_TRACE"] = str(trace_path)
              env["HERMES_HOME"] = str(session_home)
              env["HERMES_RUNTIME_HOME"] = str(base_home)
              log_path = trace_root / f"{trace_id}.log"
              print(f"QUALIFY START {case['id']}", flush=True)
              try:
                  proc = subprocess.run(
                      ["hermes", "chat", "--toolsets", "skills", "-q", case["prompt"],
                       "--provider", "custom", "--model", model],
                      env=env,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      timeout=180,
                  )
              except subprocess.TimeoutExpired as exc:
                  output = exc.stdout or ""
                  if isinstance(output, bytes):
                      output = output.decode("utf-8", errors="replace")
                  log_path.write_text(output + "\nqualification timeout after 180s\n", encoding="utf-8")
                  raise SystemExit(f"FAIL: {case['id']} routing qualification timed out after 180 seconds.")

              log_path.write_text(proc.stdout, encoding="utf-8")
              if proc.returncode != 0:
                  raise SystemExit(f"FAIL: {case['id']} Hermes exited with {proc.returncode}; see {log_path}")

              selected, loaded = set(), set()
              for line in trace_path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  event = json.loads(line)
                  if event.get("hook_event_name") == "post_tool_call" and event.get("tool_name") == "skill_view":
                      name = (event.get("args") or {}).get("name")
                      if isinstance(name, str) and name:
                          selected.add(name)
                  if event.get("hook_event_name") == "on_skill_lifecycle" and event.get("action") == "loaded":
                      name = event.get("skill_name")
                      if isinstance(name, str) and name:
                          loaded.add(name)

              expected = expected_runtime_names[case["expected_skill"]]
              if selected != {expected}:
                  raise SystemExit(f"FAIL: {case['id']} must call skill_view exactly once for {expected}; observed {sorted(selected)}.")
              if loaded != {expected}:
                  raise SystemExit(f"FAIL: {case['id']} must load exactly {expected}; observed {sorted(loaded)}.")
              print(f"PASS: {case['id']} selected and loaded only {expected}.", flush=True)

          print("PASS: all four routing qualification cases passed; starting the 12-observation benchmark.", flush=True)
          PY
          ollama ps | tee "$RUNNER_TEMP/ollama-loaded-models.txt"
          grep -q '65536' "$RUNNER_TEMP/ollama-loaded-models.txt" || { echo "Ollama did not load the model with the required 64K context." >&2; exit 1; }

      - name: Run 12 independent fresh-session observations
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          HERMES_STREAM_READ_TIMEOUT: '1800'
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/activation-traces"

          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          cases = json.loads(Path("benchmarks/activation/skill-activation-v1.json").read_text())["cases"]
          trace_root = Path(os.environ["RUNNER_TEMP"]) / "activation-traces"
          base_home = Path(os.environ["HERMES_HOME"])
          model = os.environ["HERMES_LOCAL_MODEL"]

          runs = []
          for case in cases:
              for repetition in range(1, int(case["repetitions"]) + 1):
                  runs.append((case, repetition))

          def run_observation(item):
              case, repetition = item
              trace_id = f'{case["id"]}-r{repetition}'
              trace_path = trace_root / f"{trace_id}.jsonl"
              trace_path.unlink(missing_ok=True)
              # Preserve every attempted fresh session, including a valid
              # negative observation where Hermes never calls skill_view.
              # Otherwise the converter silently drops sessions with no events,
              # biasing activation rates and making the corpus incomplete.
              trace_path.touch()

              session_home = trace_root / f"{trace_id}-hermes-home"
              shutil.rmtree(session_home, ignore_errors=True)
              session_home.mkdir(parents=True, exist_ok=True)

              # Keep the installed runtime and static benchmark assets shared.
              # Only Hermes HOME state is isolated per observation. Copy only the
              # non-secret config so enabled plugins and runtime settings remain
              # identical; do not copy .env, auth, databases, sessions, or logs.
              (session_home / "config.yaml").write_bytes((base_home / "config.yaml").read_bytes())
              for dirname in ("plugins", "skills"):
                  (session_home / dirname).symlink_to(base_home / dirname, target_is_directory=True)

              env = os.environ.copy()
              env["SKILLS_TREE_HERMES_TRACE"] = str(trace_path)
              env["HERMES_HOME"] = str(session_home)
              env["HERMES_RUNTIME_HOME"] = str(base_home)

              print(f"=== START {trace_id} ===", flush=True)
              try:
                  proc = subprocess.run(
                      ["hermes", "chat", "--toolsets", "skills", "-q", case["prompt"], "--provider", "custom", "--model", model],
                      env=env,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      timeout=240,
                  )
                  (trace_root / f"{trace_id}.log").write_text(proc.stdout, encoding="utf-8")
                  print(f"=== END {trace_id}: exit_code={proc.returncode} ===", flush=True)
                  return trace_id, proc.returncode
              except subprocess.TimeoutExpired as exc:
                  output = exc.stdout or ""
                  if isinstance(output, bytes):
                      output = output.decode("utf-8", errors="replace")
                  (trace_root / f"{trace_id}.log").write_text(
                      output + "\nrunner exception: timeout after 240s\n",
                      encoding="utf-8",
                  )
                  print(f"=== TIMEOUT {trace_id} after 240s ===", flush=True)
                  return trace_id, 124
              except Exception as exc:
                  (trace_root / f"{trace_id}.log").write_text(
                      f"runner exception: {exc}\n",
                      encoding="utf-8",
                  )
                  print(f"=== ERROR {trace_id}: {exc} ===", flush=True)
                  return trace_id, 125

          max_workers = 1
          with ThreadPoolExecutor(max_workers=max_workers) as pool:
              futures = [pool.submit(run_observation, item) for item in runs]
              for future in as_completed(futures):
                  trace_id, rc = future.result()
                  print(f"completed {trace_id} rc={rc}", flush=True)

          PY
      - name: Convert explicit runtime traces to benchmark observations
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          trace_root = Path(os.environ["RUNNER_TEMP"]) / "activation-traces"
          import re

          mapping = {
              "skills-tree-rag": "03-memory/rag",
              "skills-tree-code-review": "05-code/code-review",
              "skills-tree-web-search": "11-web/web-search",
          }

          def observed_skill_id(name):
              if name in mapping:
                  return mapping[name]
              # Preserve out-of-scope skill loads instead of silently dropping them.
              # The evaluator treats any non-expected skill selection as a false activation.
              safe_name = re.sub(r"[^a-z0-9._/-]+", "-", name.lower()).strip("-")
              return "unmapped/" + safe_name

          runs = []
          for trace_path in sorted(trace_root.glob("ACT-*.jsonl")):
              trace_id = trace_path.stem
              case_id = trace_id.split("-r", 1)[0]
              selected, executed = set(), set()

              for line in trace_path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  event = json.loads(line)
                  if event.get("hook_event_name") == "post_tool_call" and event.get("tool_name") == "skill_view":
                      name = (event.get("args") or {}).get("name")
                      if isinstance(name, str) and name:
                          selected.add(observed_skill_id(name))
                  if event.get("hook_event_name") == "on_skill_lifecycle" and event.get("action") == "loaded":
                      name = event.get("skill_name")
                      if isinstance(name, str) and name:
                          executed.add(observed_skill_id(name))

              events = [
                  {"kind": "skill_selection", "skill_id": skill, "status": "observed"}
                  for skill in sorted(selected)
              ]
              events.extend(
                  {"kind": "skill_execution", "skill_id": skill, "status": "observed"}
                  for skill in sorted(executed)
              )

              runs.append({
                  "run_id": trace_id,
                  "case_id": case_id,
                  "trace_id": trace_id,
                  "events": events,
              })

          out = Path(os.environ["RUNNER_TEMP"]) / "skill-activation-observations.json"
          out.write_text(
              json.dumps({"schema_version": "1.0", "runs": runs}, indent=2) + chr(10),
              encoding="utf-8",
          )
          print(out.read_text())
          PY

      - name: Validate observation corpus against schema
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from jsonschema import Draft202012Validator

          obs = json.loads((Path(os.environ["RUNNER_TEMP"]) / "skill-activation-observations.json").read_text())
          schema = json.loads(Path("meta/skill-activation-observation.schema.json").read_text())
          errors = list(Draft202012Validator(schema).iter_errors(obs))
          if errors:
              print(errors[0].message)
              raise SystemExit(1)
          print("PASS: observation corpus matches schema.")
          PY

      - name: Run activation benchmark
        id: benchmark
        run: |
          python tools/run_skill_activation_benchmark.py --observations "$RUNNER_TEMP/skill-activation-observations.json" --output "$RUNNER_TEMP/skill-activation-benchmark-result.json"

      - name: Write evidence summary
        if: always()
        run: |
          echo "## Real skill activation evidence" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/skill-activation-benchmark-result.json" ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"skill-activation-benchmark-result.json"
          d=json.loads(p.read_text())
          print(f"- Status: **{d['status']}**")
          print(f"- Runs: **{d['metrics']['runs']} / {d['metrics']['required_runs']}**")
          print(f"- Observed cases: **{d['metrics']['observed_cases']} / {d['metrics']['cases']}**")
          print(f"- Invocation evidence rate: **{d['metrics']['invocation_evidence_rate']}**")
          print(f"- False activation rate: **{d['metrics']['false_activation_rate']}**")
          print(f"- Acceptance: **{d.get('acceptance', {}).get('status', 'NOT_EVALUATED')}**")
          for failure in d.get('acceptance', {}).get('failures', []):
              print(f"  - FAIL: {failure}")
          PY
          else
            echo "- Benchmark result was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-activation-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/activation-traces/*.jsonl
            ${{ runner.temp }}/activation-traces/*.log
            ${{ runner.temp }}/skill-activation-observations.json
            ${{ runner.temp }}/skill-activation-benchmark-result.json
            ${{ runner.temp }}/hermes-skills.txt
            ${{ runner.temp }}/activation-qualification/*.jsonl
            ${{ runner.temp }}/activation-qualification/*.log
            ${{ runner.temp }}/ollama-loaded-models.txt
            ${{ runner.temp }}/ollama.log
          if-no-files-found: warn

      - name: Enforce benchmark acceptance contract
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "skill-activation-benchmark-result.json"
          if not result_path.exists():
              raise SystemExit("FAIL: benchmark result is missing.")
          result = json.loads(result_path.read_text(encoding="utf-8"))
          metrics = result.get("metrics", {})
          acceptance = result.get("acceptance", {})
          required_runs = metrics.get("required_runs")
          runs = metrics.get("runs")
          failures = list(acceptance.get("failures", []))
          if result.get("status") != "COMPLETE":
              failures.append(f"corpus status must be COMPLETE, got {result.get('status')}")
          if runs != required_runs:
              failures.append(f"observation count must equal required_runs ({required_runs}), got {runs}")
          if metrics.get("expected_activation_rate") != 1.0:
              failures.append("expected_activation_rate must equal 1.0")
          if metrics.get("false_activation_rate") != 0.0:
              failures.append("false_activation_rate must equal 0.0")
          if metrics.get("invocation_evidence_rate") != 1.0:
              failures.append("invocation_evidence_rate must equal 1.0")
          if acceptance.get("status") != "PASS" or failures:
              print("FAIL: benchmark acceptance contract not satisfied.")
              for failure in dict.fromkeys(failures):
                  print(f"- {failure}")
              raise SystemExit(1)
          print(f"PASS: exact {required_runs}-observation corpus meets all activation and invocation gates.")
          PY
