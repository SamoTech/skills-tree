name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/SKILLS_GRAPH.json'
      - 'agent-skills/**'
      - 'skills/**'
      - 'tools/generate_agent_skills.py'
      - 'tools/reconcile_agent_skills.py'
      - 'tools/validate_agent_skills.py'
      - 'tools/build_agent_skills_discovery.py'
      - 'tools/verify_agent_skills_discovery.py'
      - 'meta/agent-skills-discovery-index.schema.json'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs and Agent Skills distribution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install MkDocs and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material mkdocs-minify-plugin pymdown-extensions jsonschema

      - name: Verify Agent Skills reconciliation
        run: |
          python tools/reconcile_agent_skills.py --check
          python tools/validate_agent_skills.py

      - name: Build MkDocs
        run: mkdocs build --strict

      - name: Stage standalone Explorer, Blueprint, and Agent Skills artifacts
        run: |
          mkdir -p site/data site/agent-skills site/.well-known/agent-skills
          cp data/SKILLS_GRAPH.json site/data/SKILLS_GRAPH.json
          cp -r agent-skills/. site/agent-skills/
          test -d docs/explorer && cp -r docs/explorer site/explorer
          test -d docs/blueprints && cp -r docs/blueprints site/blueprints

      - name: Disable Jekyll processing for static discovery paths
        run: |
          touch site/.nojekyll
          test -f site/.nojekyll

      - name: Generate deterministic discovery index
        run: |
          python tools/build_agent_skills_discovery.py             --output site/.well-known/agent-skills/index.json

      - name: Verify local publication bytes
        run: |
          python tools/verify_agent_skills_discovery.py             --index-file site/.well-known/agent-skills/index.json             --site-root site

      - name: Verify Pages artifact
        run: |
          test -f site/index.html
          test -f site/data/SKILLS_GRAPH.json
          test -f site/explorer/index.html
          test -f site/blueprints/index.html
          test -f site/.nojekyll
          test -f site/.well-known/agent-skills/index.json
          test -d site/agent-skills

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify served discovery bytes
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }
        run: |
          python tools/verify_agent_skills_discovery.py             --index-url "${PAGES_URL%/}/.well-known/agent-skills/index.json"
