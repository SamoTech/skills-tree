name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/SKILLS_GRAPH.json'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install MkDocs and plugins
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material mkdocs-minify-plugin pymdown-extensions

      - name: Build MkDocs
        run: mkdocs build --strict

      - name: Stage standalone Explorer and Blueprint apps
        run: |
          mkdir -p site/data
          cp data/SKILLS_GRAPH.json site/data/SKILLS_GRAPH.json
          test -d docs/explorer && cp -r docs/explorer site/explorer
          test -d docs/blueprints && cp -r docs/blueprints site/blueprints

      - name: Verify Pages artifact
        run: |
          test -f site/index.html
          test -f site/data/SKILLS_GRAPH.json
          test -f site/explorer/index.html
          test -f site/blueprints/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
