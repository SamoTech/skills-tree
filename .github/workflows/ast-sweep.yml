# ast-sweep.yml
#
# Phase 1 of the Dependency Watchdog pipeline.
# Runs on every PR that touches a skill .md file.
# The current ast_sweep.py implementation performs a repository-wide
# dependency scan; run it in dry-run mode here so CI validates the sweep
# without attempting to push generated artifacts from a PR workflow.
#
# Security model:
#   - Runs on pull_request (not pull_request_target).
#   - No secrets beyond GITHUB_TOKEN are used.
#   - The checkout is used only for static analysis; no skill code is executed.

name: AST Sweep (Phase 1)

on:
  pull_request:
    paths:
      - 'skills/**/*.md'
  workflow_dispatch:

concurrency:
  group: ast-sweep-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  sweep:
    name: Extract dependencies from skill files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sweep dependencies
        run: pip install --quiet PyYAML==6.0.2 httpx==0.28.1

      - name: Run AST sweep
        run: python tools/ast_sweep.py --skills-root skills --dry-run
