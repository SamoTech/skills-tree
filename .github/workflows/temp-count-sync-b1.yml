name: Temp Count Sync Batch 1

# Temporary count-sync workflow for the 2026-10-19 expansion batch 1 PR.
# Runs the repo's own count updater and commits the machine-generated
# README.md / docs/index.md anchors, then is deleted before merge.
# Retrigger v2.

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temp-count-b1
  cancel-in-progress: false

jobs:
  counts:
    if: github.head_ref == 'skills/expansion-2026-10-19-b1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pyyaml pytest jsonschema
      - name: Update README and docs index counts
        run: python3 tools/update_readme_counts.py
      - name: Verify count tests
        run: python -m pytest tests/test_update_readme_counts.py -q
      - name: Commit updated counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md docs/index.md
          git diff --staged --quiet && echo "no count changes" && exit 0
          git commit -m "chore: update README and docs index counts for expansion batch 1"
          git push origin HEAD:${{ github.head_ref }}
