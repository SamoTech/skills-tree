name: Governance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "AI_CONSTITUTION.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "meta/**"
      - "tools/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "AI_CONSTITUTION.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "meta/**"
      - "tools/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: Verify repository governance contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify governance contracts
        run: python tools/verify_governance.py
