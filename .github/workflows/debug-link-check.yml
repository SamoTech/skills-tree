name: Debug link check

# Temporary diagnostic workflow added by the owner-directed wave-2 batch-2 work.
# Runs the exact check-links lychee invocation with fail disabled and publishes
# the complete failure report as a check run (readable via the public API).
# Removed once the offending links are identified and fixed.

on:
  pull_request:
    paths:
      - '.github/workflows/debug-link-check.yml'

permissions: {}

jobs:
  linkdebug:
    name: Debug external link failures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --exclude 'localhost'
            --exclude '127\.0\.0\.1'
            --exclude 'example\.com'
            --timeout 30
            --max-retries 3
            'skills/**/*.md'
          fail: false
          output: lychee/out.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Emit failure annotations
        run: |
          if [ -f lychee/out.md ]; then
            grep -E 'Rejected status code' lychee/out.md | head -n 10 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          else
            echo "No lychee output file found (no failures reported or report not written)"
          fi

      - name: Publish full report as check run
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            if (fs.existsSync('lychee/out.md')) {
              report = fs.readFileSync('lychee/out.md', 'utf8');
            }
            const failures = (report.match(/.*Rejected status code.*/g) || []);
            const summary = failures.length
              ? failures.join('\n').slice(0, 60000)
              : 'No link failures reported';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Full lychee failure report',
              head_sha: context.sha,
              status: 'completed',
              conclusion: failures.length ? 'failure' : 'success',
              output: {
                title: 'Lychee failures: ' + failures.length,
                summary: summary,
                text: report.slice(0, 60000),
              },
            });
