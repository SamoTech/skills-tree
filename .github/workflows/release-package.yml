name: Release Package

# Triggered when a version tag (e.g. v2.3.0, v3.0.0) is pushed.
# Produces a self-contained zip of the full skill catalog + API artifacts
# and attaches it to the GitHub Release as a downloadable asset.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to package (e.g. v2.3.0). Uses latest tag if omitted.'
        required: false
        default: ''

permissions:
  contents: write   # required for gh release upload

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout full history so export_skills.py can walk all files ──────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python env ─────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Regenerate skills.json / skills.yaml so the zip is always fresh ───
      - name: Regenerate skills API export
        run: python3 tools/export_skills.py

      # ── 4. Determine the tag name ─────────────────────────────────────────────
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # ── 5. Build the release zip + MANIFEST.json ──────────────────────────────
      - name: Build release package
        run: python3 tools/package_release.py --tag "${{ steps.tag.outputs.name }}"
        env:
          GITHUB_SHA: ${{ github.sha }}

      # ── 6. Show what we're shipping ───────────────────────────────────────────
      - name: Inspect artifact
        run: |
          echo "=== Release artifact ==="
          ls -lh dist/
          echo ""
          echo "=== MANIFEST.json ==="
          cat dist/MANIFEST.json
          echo ""
          echo "=== Zip contents (top-level) ==="
          unzip -l dist/skills-tree-*.zip | head -40

      # ── 7. Create or update the GitHub Release and upload the asset ───────────
      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          ZIP_FILE=$(ls dist/skills-tree-*.zip)
          MANIFEST_FILE="dist/MANIFEST.json"

          # Read skill count from MANIFEST for release notes
          SKILL_COUNT=$(python3 -c "import json; print(json.load(open('${MANIFEST_FILE}'))['skill_count'])")
          CATEGORY_COUNT=$(python3 -c "import json; print(json.load(open('${MANIFEST_FILE}'))['category_count'])")
          BATTLE_TESTED=$(python3 -c "import json; print(json.load(open('${MANIFEST_FILE}'))['battle_tested_count'])")
          ZIP_SIZE=$(du -h "$ZIP_FILE" | cut -f1)

          BODY="## Skills Tree ${TAG}

### 📦 Release Package Contents

| Item | Count |
|------|-------|
| Total skills | ${SKILL_COUNT} |
| Categories | ${CATEGORY_COUNT} |
| Battle-tested (v3) | ${BATTLE_TESTED} |
| Package size | ${ZIP_SIZE} |

### What's in the zip?

\`\`\`
skills-tree-${TAG}.zip
├── skills/          All skill files (.md) — full taxonomy tree
├── systems/         Multi-skill workflow documents
├── blueprints/      Production-ready architecture docs
├── benchmarks/      Reproducible head-to-head comparisons
├── labs/            Experimental / bleeding-edge entries
├── api/
│   ├── skills.json  Programmatic API — all skill objects
│   └── skills.yaml  Same data in YAML
└── MANIFEST.json    Release metadata (count, SHA, timestamp)
\`\`\`

### Usage

\`\`\`bash
# Download and inspect
curl -L https://github.com/SamoTech/skills-tree/releases/download/${TAG}/skills-tree-${TAG}.zip \
  -o skills-tree-${TAG}.zip
unzip skills-tree-${TAG}.zip -d skills-tree-${TAG}

# Use the JSON API offline
jq '.skills | length' skills-tree-${TAG}/api/skills.json
jq '.skills[] | select(.level == \"basic\") | .title' skills-tree-${TAG}/api/skills.json
\`\`\`

### Verify integrity

\`\`\`bash
sha256sum skills-tree-${TAG}.zip
\`\`\`
(SHA-256 checksum is embedded in MANIFEST.json)

---
*Auto-generated by [release-package.yml](/.github/workflows/release-package.yml)*"

          # Create release if it doesn't exist; otherwise update body only
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Skills Tree ${TAG}" \
              --notes "$BODY" \
              "$ZIP_FILE#skills-tree-${TAG}.zip" \
              "$MANIFEST_FILE#MANIFEST.json"
            echo "✅ Created new release ${TAG} with artifacts."
          else
            gh release upload "$TAG" \
              "$ZIP_FILE#skills-tree-${TAG}.zip" \
              "$MANIFEST_FILE#MANIFEST.json" \
              --clobber
            echo "✅ Uploaded artifacts to existing release ${TAG}."
          fi
