name: Zero-Touch Release

# Single pipeline: semantic-release → build → PyPI → GitHub Release.
# Trigger: every push to main.
# If no releasable commits exist, semantic-release exits 0 and all
# downstream steps are skipped via the `released` output gate.
on:
  push:
    branches: [main]

concurrency:
  group: zero-touch-release
  cancel-in-progress: false

# Workflow-level: read-only.
# id-token:write is declared only on the publish job (job level)
# so GitHub scopes the OIDC token to that job + environment.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Semantic Release
  # ---------------------------------------------------------------------------
  semantic-release:
    name: "1 • Semantic Release"
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.psr.outputs.released }}
      version:  ${{ steps.psr.outputs.version }}
      tag:      ${{ steps.psr.outputs.tag }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-semantic-release
        run: pip install 'python-semantic-release>=9.8' --quiet

      - name: Determine and create semantic release
        id: psr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(python - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          EOF
          )

          # Python Semantic Release prints the current version when no release
          # is due. Compare the calculated next version before mutating the repo.
          NEXT=$(semantic-release version --print)

          echo "current pyproject version : $CURRENT"
          echo "calculated next version   : $NEXT"

          if [ "$NEXT" = "$CURRENT" ]; then
            echo "released=false"   >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "tag=v$CURRENT"    >> "$GITHUB_OUTPUT"
            echo "::notice::No releasable commits — skipping build and publish."
            exit 0
          fi

          echo "::notice::Creating release v$NEXT"
          semantic-release version

          EXPECTED_TAG="v$NEXT"
          if ! git rev-parse --verify "refs/tags/$EXPECTED_TAG" >/dev/null 2>&1; then
            echo "::error::Semantic release completed without creating expected tag $EXPECTED_TAG"
            exit 1
          fi

          RELEASED_VERSION=$(python - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          EOF
          )

          if [ "$RELEASED_VERSION" != "$NEXT" ]; then
            echo "::error::pyproject.toml version $RELEASED_VERSION does not match released version $NEXT"
            exit 1
          fi

          echo "released=true"  >> "$GITHUB_OUTPUT"
          echo "version=$NEXT"   >> "$GITHUB_OUTPUT"
          echo "tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2 — Build & Verify
  # ---------------------------------------------------------------------------
  build:
    name: "2 • Build & Verify"
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine --quiet

      - name: Verify pyproject.toml version matches tag
        run: |
          TOML_VER=$(python - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          EOF
          )
          EXPECTED="${{ needs.semantic-release.outputs.version }}"
          if [ "$TOML_VER" != "$EXPECTED" ]; then
            echo "ERROR: pyproject.toml=$TOML_VER but expected=$EXPECTED"
            exit 1
          fi
          echo "Version check passed: $TOML_VER"

      - name: Build sdist + wheel
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - name: Assert required runtime assets in wheel
        run: |
          python - <<'PYEOF'
          import zipfile, glob, sys
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("ERROR: no wheel in dist/")
          required = [
              "data/SKILLS_GRAPH.json",
              "meta/GOAL_TAXONOMY.md",
              "benchmarks/INDEX.json",
          ]
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          missing = [f for f in required if not any(n.endswith(f) for n in names)]
          for f in required:
              print(f"  {'\u274c' if f in missing else '\u2705'}  {f}")
          if missing:
              sys.exit(1)
          PYEOF

      - name: Validate CHANGELOG entry exists
        run: |
          VERSION="${{ needs.semantic-release.outputs.version }}"
          if ! grep -q "\[${VERSION}\]" CHANGELOG.md; then
            echo "WARNING: no CHANGELOG entry for v${VERSION}."
          else
            echo "CHANGELOG entry confirmed for v${VERSION}."
          fi

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.semantic-release.outputs.version }}
          path: dist/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 3 — Publish to PyPI
  # id-token:write at JOB level is required for OIDC scoping to work
  # when an environment: block is present.
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: "3 • Publish → PyPI"
    needs: [semantic-release, build]
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # job-level: OIDC token scoped to this job + environment
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/skills-tree/${{ needs.semantic-release.outputs.version }}/

    steps:
      - name: Download dist/
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.semantic-release.outputs.version }}
          path: dist/

      # -----------------------------------------------------------------------
      # OIDC pre-flight check.
      # Prints the exact values PyPI will validate against.
      # Fails with a clear, actionable error if they do not match.
      # -----------------------------------------------------------------------
      - name: OIDC pre-flight — verify Trusted Publisher configuration
        run: |
          echo "=== OIDC Trusted Publisher pre-flight ==="
          echo ""
          REPO="${GITHUB_REPOSITORY}"
          WORKFLOW=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          ENV="pypi"

          echo "  Repository : $REPO"
          echo "  Workflow   : $WORKFLOW"
          echo "  Environment: $ENV"
          echo ""

          EXPECTED_REPO="SamoTech/skills-tree"
          EXPECTED_WF="zero-touch-release.yml"

          FAILED=0
          if [ "$REPO" != "$EXPECTED_REPO" ]; then
            echo "  ERROR: repository mismatch"
            echo "         got      : $REPO"
            echo "         expected : $EXPECTED_REPO"
            echo "  Fix: update the Trusted Publisher entry at"
            echo "       https://pypi.org/manage/project/skills-tree/settings/publishing/"
            FAILED=1
          else
            echo "  ✅ repository matches"
          fi

          if [ "$WORKFLOW" != "$EXPECTED_WF" ]; then
            echo "  ERROR: workflow filename mismatch"
            echo "         got      : $WORKFLOW"
            echo "         expected : $EXPECTED_WF"
            echo "  Fix: update the Workflow filename field in the Trusted Publisher."
            FAILED=1
          else
            echo "  ✅ workflow filename matches"
          fi

          echo "  ✅ environment: $ENV"
          echo ""

          if [ "$FAILED" = "1" ]; then
            echo "=== OIDC pre-flight FAILED ==="
            echo ""
            echo "Required PyPI Trusted Publisher settings:"
            echo "  PyPI project name : skills-tree"
            echo "  Owner             : SamoTech"
            echo "  Repository        : skills-tree"
            echo "  Workflow filename : zero-touch-release.yml"
            echo "  Environment       : pypi"
            echo ""
            echo "Configure at: https://pypi.org/manage/project/skills-tree/settings/publishing/"
            exit 1
          fi

          echo "=== OIDC pre-flight PASSED — proceeding to publish ==="

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------------------
  # Job 4 — Attach dist/ to GitHub Release
  # ---------------------------------------------------------------------------
  attach-assets:
    name: "4 • Attach Release Assets"
    needs: [semantic-release, build, publish-pypi]
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.tag }}
          fetch-depth: 1

      - name: Download Python dist/
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.semantic-release.outputs.version }}
          path: dist/python

      - name: Build catalog release package
        run: |
          python3 tools/package_release.py --tag "${{ needs.semantic-release.outputs.tag }}"
          mv dist/skills-tree-*.zip dist/catalog.zip
          mv dist/MANIFEST.json dist/catalog-MANIFEST.json
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Attach all release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.semantic-release.outputs.tag }}
          files: |
            dist/python/*.whl
            dist/python/*.tar.gz
            dist/catalog.zip
            dist/catalog-MANIFEST.json
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
