name: Temp fix collision package (PR #621)

on:
  push:
    branches: [counsel/audit-fixes-2-2026-10-18]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: counsel/audit-fixes-2-2026-10-18
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet PyYAML==6.0.3

      - name: Rewrite collision package with canonical projection
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, 'tools')
          from pathlib import Path
          from generate_agent_skills import project
          root = Path('.').resolve()
          p = project(root / 'skills/10-computer-use/drag-drop.md', root, name_override='computer-use-drag-drop')
          assert p.eligible, p.blockers
          dest = root / 'agent-skills' / p.name / 'SKILL.md'
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(p.content.rstrip() + chr(10), encoding='utf-8')
          print('wrote', dest)
          PYEOF

      - name: Reconcile check (report to summary on failure)
        run: |
          python3 tools/reconcile_agent_skills.py --check --output /tmp/report.json || (cat /tmp/report.json >> "$GITHUB_STEP_SUMMARY"; exit 1)

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-skills/
          git diff --staged --quiet && echo "No generated changes." && exit 0
          git commit -m "chore: canonical projection for computer-use-drag-drop (temp automation, PR #621)"
          git push origin HEAD:counsel/audit-fixes-2-2026-10-18
