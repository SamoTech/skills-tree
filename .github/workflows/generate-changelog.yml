name: Generate Changelog

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_ENV"

      - name: Build changelog entry
        run: |
          mkdir -p meta
          DATE=$(date -u +%Y-%m-%d)
          cat > /tmp/changelog-entry.md <<EOF
          ## PR #${PR_NUMBER} — ${DATE}

          - Title: ${{ github.event.pull_request.title }}
          - Author: @${{ github.event.pull_request.user.login }}
          - URL: ${{ github.event.pull_request.html_url }}
          EOF

          touch meta/CHANGELOG.md
          cat /tmp/changelog-entry.md meta/CHANGELOG.md > /tmp/CHANGELOG.new
          mv /tmp/CHANGELOG.new meta/CHANGELOG.md

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes."
            exit 0
          fi
          git commit -m "chore(changelog): auto-append entry for PR #${PR_NUMBER} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD && exit 0
            echo "Push rejected (attempt ${attempt}/5) — rebasing..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 2))
          done
          echo "ERROR: All push attempts failed."
          exit 1
