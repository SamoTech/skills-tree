name: Auto-generate Changelog

# Appends an entry to meta/CHANGELOG.md whenever a skill PR is merged.
# Detects the skill name and type from the PR title:
#   feat: [skill-name] description    -> Added
#   improve: [skill-name] vX->vY      -> Improved
#   fix: [skill-name] description     -> Fixed
#   deprecate: [skill-name]           -> Deprecated
# If the title doesn't match any pattern, no entry is written.

on:
  pull_request:
    types: [closed]
    paths:
      - 'skills/**/*.md'

# Serialize this generated-main writer with the other workflows that commit to main.
concurrency:
  group: auto-commit-main
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  append-changelog:
    name: Append changelog entry
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse PR and append changelog
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          python3 tools/generate_changelog.py

      - name: Publish generated changes through protected-main PR
        env:
          GENERATED_BRANCH: automation/generated-changelog
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/CHANGELOG.md
          git diff --staged --quiet && echo "No generated changes." && exit 0
          git commit -m "chore(changelog): auto-update CHANGELOG.md [skip ci]"
          git push --force origin HEAD:"$GENERATED_BRANCH"

          if gh pr list --base main --head "$GENERATED_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create               --base main               --head "$GENERATED_BRANCH"               --title "chore(changelog): auto-update CHANGELOG.md"               --body "Publish the generated changelog entry through a protected-main PR.

          This automation branch exists because main is protected. Merge only through the normal PR checks."
          else
            echo "Open automation PR already exists for $GENERATED_BRANCH."
          fi