name: Auto-generate Changelog

# Appends an entry to meta/CHANGELOG.md whenever a skill PR is merged.
# Detects the skill name and type from the PR title:
#   feat: [skill-name] description    -> Added
#   improve: [skill-name] vX->vY      -> Improved
#   fix: [skill-name] description     -> Fixed
#   deprecate: [skill-name]           -> Deprecated
# If the title doesn't match any pattern, no entry is written.

on:
  pull_request:
    types: [closed]
    paths:
      - 'skills/**/*.md'

permissions:
  contents: write
  pull-requests: read

jobs:
  append-changelog:
    name: Append changelog entry
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse PR and append changelog
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          python3 tools/generate_changelog.py

      - name: Commit changelog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meta/CHANGELOG.md
          git diff --staged --quiet && echo 'No changelog changes.' && exit 0
          git commit -m 'chore(changelog): auto-update CHANGELOG.md [skip ci]'
          git pull --rebase
          git push
