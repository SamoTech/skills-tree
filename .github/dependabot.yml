version: 2

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Cairo
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependabot
      - github-actions
    commit-message:
      prefix: "chore(deps)"

  # Python dependencies
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Cairo
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
      python-major:
        update-types:
          - major
    labels:
      - dependabot
      - python
    ignore:
      # Never auto-upgrade major versions without manual review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
